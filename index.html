<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuriX — Audiophile CD Experience</title>

  <!-- External libraries -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- High-Fidelity Songs Data with Base64 Album Arts -->
  <script src="./songs-data.js"></script>

  <style>
    @font-face {
      font-family: 'NeueMontreal';
      src: url('./fonts/PPNeueMontreal-Medium.woff2') format('woff2');
      font-weight: 500;
    }
    @font-face {
      font-family: 'PPEiko';
      src: url('./fonts/PPEiko-Regular.woff2') format('woff2');
      font-weight: 400;
    }

    :root {
      --bg-color: #f7f7f6;
      --text-color: #111111;
      --border-color: rgba(0, 0, 0, 0.12);
      --font-serif: 'PPEiko', Georgia, 'Times New Roman', serif;
      --font-sans: 'NeueMontreal', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Film grain texture */
    .grain {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 50;
    }

    /* ========================================================
       AUTHENTIC A24 TOP NAVIGATION & DROPDOWN OPENING
       ======================================================== */
    .nav {
      --nav-open-height: 24em;
      --nav-scroll-fade: 2.8em;
      --nav-ease: cubic-bezier(.32, .72, 0, 1);
      --nav-open-duration: .62s;
      --nav-close-duration: .46s;
      --nav-active-bg: var(--text-color, #111111);
      --nav-active-text: #ffffff;
      --nav-dot-gap: .3em;

      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 4.5em;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }

    /* Unrolling Card Background (28em width, exactly centered) */
    .nav-bg {
      position: absolute;
      inset: 0% 0% auto;
      width: 28em;
      height: 0px;
      margin-left: auto;
      margin-right: auto;
      background-color: #ffffff;
      border-bottom-left-radius: 0.75em;
      border-bottom-right-radius: 0.75em;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      pointer-events: none;
      will-change: height;
      transition: height var(--nav-close-duration) var(--nav-ease);
    }

    .nav[data-nav-dropdown="open"] .nav-bg {
      height: var(--nav-open-height);
      transition-duration: var(--nav-open-duration);
    }

    /* Background Tint Overlay */
    .page-bg {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.22);
      opacity: 0;
      pointer-events: none;
      z-index: 90;
      transition: opacity var(--nav-close-duration) var(--nav-ease);
    }

    .nav[data-nav-dropdown="open"] ~ .page-bg,
    .page-bg.is-active {
      opacity: 1;
      pointer-events: auto;
      transition-duration: var(--nav-open-duration);
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 36px;
      pointer-events: auto;
      z-index: 2;
      position: relative;
    }

    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--text-color);
      cursor: pointer;
      line-height: 1;
      z-index: 2;
      position: relative;
      transition: opacity 0.2s ease;
    }

    .nav-logo:hover {
      opacity: 0.65;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
      position: relative;
    }

    .nav-item {
      position: relative;
    }

    .nav-link {
      font-size: 0.95rem;
      color: var(--text-color);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.4em 0.6em;
      position: relative;
      border-radius: 0.25em;
      transition: opacity 0.2s ease, color 0.2s ease;
    }

    .nav-link:hover {
      opacity: 0.65;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--text-color);
      border-radius: 50%;
    }

    .nav-chevron {
      width: 9px;
      height: 5px;
      transition: transform var(--nav-close-duration) var(--nav-ease);
    }

    [data-dropdown-toggle="open"] .nav-chevron {
      transition-duration: var(--nav-open-duration);
      transform: rotate(180deg);
    }

    /* Authentic A24 Dropdown Container */
    .nav-dropdown {
      z-index: 1;
      box-sizing: border-box;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      width: 28em;
      margin-left: auto;
      margin-right: auto;
      padding-top: 4.5em;
      padding-bottom: 0px;
      position: fixed;
      top: 0px;
      left: 0px;
      right: 0px;
      height: 0px;
      overflow: hidden;
      transition: height var(--nav-close-duration) var(--nav-ease),
                  opacity calc(var(--nav-close-duration) * .6) var(--nav-ease),
                  visibility 0s linear calc(var(--nav-close-duration) * .6);
    }

    .nav[data-nav-dropdown="open"] .nav-dropdown {
      height: var(--nav-open-height);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: height var(--nav-open-duration) var(--nav-ease),
                  opacity calc(var(--nav-open-duration) * .45) var(--nav-ease),
                  visibility 0s;
    }

    .nav-dropdown__overflow,
    .nav-dropdown__overflow-inner {
      height: 100%;
      min-height: 0px;
      overflow: hidden;
    }

    .nav-dropdown__content {
      --nav-fade-top: 0;
      --nav-fade-bottom: 0;
      width: 100%;
      height: 100%;
      min-height: 0px;
      display: block;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      pointer-events: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      mask-size: 100% 100%;
      mask-repeat: no-repeat;
      mask-image: linear-gradient(
        to bottom,
        transparent 0,
        black calc(var(--nav-scroll-fade) * var(--nav-fade-top)),
        black calc(100% - var(--nav-scroll-fade) * var(--nav-fade-bottom)),
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0,
        black calc(var(--nav-scroll-fade) * var(--nav-fade-top)),
        black calc(100% - var(--nav-scroll-fade) * var(--nav-fade-bottom)),
        transparent 100%
      );
    }

    .nav-dropdown__content::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .nav-dropdown__content-li {
      pointer-events: auto;
      width: 100%;
      height: auto;
      min-height: 0px;
      display: flex;
      flex-direction: column;
      gap: 0.15em;
      padding: 0.25em 3.2em 3em 3.2em;
    }

    .nav-dropdown__row {
      width: 100%;
      display: block;
      pointer-events: auto;
    }

    .nav-dropdown__link {
      pointer-events: auto;
      cursor: pointer;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0.45em 0.75em;
      border-radius: 0.25em;
      text-decoration: none;
      color: var(--text-color);
      transition: color 0.14s var(--nav-ease);
      overflow: hidden;
    }

    .nav-dropdown__link-bg {
      position: absolute;
      inset: 0%;
      border-radius: 0.25em;
      background-color: var(--nav-active-bg);
      opacity: 0;
      transform: scaleY(0);
      transform-origin: 50% 100%;
      pointer-events: none;
      z-index: 0;
      will-change: transform, opacity;
      transition: transform 0.2s var(--nav-ease), opacity 0.2s var(--nav-ease), background-color 0.2s var(--nav-ease);
    }

    .nav-dropdown__link-inner {
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      min-width: 0px;
      gap: 1em;
    }

    .nav-dropdown__link-label {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.35;
      letter-spacing: -0.015em;
      transition: color 0.14s var(--nav-ease);
    }

    .nav-dropdown__title {
      font-weight: 500;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
    }

    .nav-dropdown__meta {
      font-size: 0.85rem;
      opacity: 0.55;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    /* Active song state (solid black pill with white text) */
    .nav-dropdown__link[data-film-status="active"] {
      color: var(--nav-active-text);
    }
    .nav-dropdown__link[data-film-status="active"] .nav-dropdown__link-bg {
      opacity: 1;
      transform: scaleY(1);
      background-color: var(--nav-active-bg);
    }
    .nav-dropdown__link[data-film-status="active"] .nav-dropdown__meta {
      opacity: 0.85;
      color: var(--nav-active-text);
    }

    /* Hover effect for inactive songs */
    @media (hover: hover) and (pointer: fine) {
      .nav-dropdown__link:hover:not([data-film-status="active"]) {
        color: var(--text-color);
      }
      .nav-dropdown__link:hover:not([data-film-status="active"]) .nav-dropdown__link-bg {
        opacity: 0.07;
        transform: scaleY(1);
        background-color: var(--text-color);
      }
    }

    /* Minimalist Scrollbar Track & Thumb */
    .nav-dropdown__scrollbar {
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      user-select: none;
      width: 3px;
      position: absolute;
      top: 5.2em;
      bottom: 2em;
      right: 1.2em;
      background-color: rgba(0, 0, 0, 0.08);
      border-radius: 3px;
      transition: opacity calc(var(--nav-close-duration) * .6) var(--nav-ease),
                  transform var(--nav-close-duration) var(--nav-ease);
      transform: translateY(0.5em);
    }

    .nav[data-nav-dropdown="open"] .nav-dropdown__scrollbar {
      opacity: 1;
      pointer-events: auto;
      transition: opacity calc(var(--nav-open-duration) * .5) var(--nav-ease) .12s,
                  transform var(--nav-open-duration) var(--nav-ease) .12s;
      transform: translateY(0px);
    }

    .nav-dropdown__scrollbar.is-disabled {
      opacity: 0 !important;
      display: none !important;
      pointer-events: none !important;
    }

    .nav-dropdown__scrollbar-progress {
      width: 100%;
      height: 40px;
      background-color: var(--text-color);
      border-radius: 3px;
      position: absolute;
      top: 0;
      will-change: transform, height;
      cursor: grab;
    }
    .nav-dropdown__scrollbar-progress.is-dragging {
      cursor: grabbing;
    }

    /* ========================================================
       TOP LEFT METADATA PANEL (1:1 with Reference Screenshot)
       Completely safe from any CD overlap
       ======================================================== */
    .hero-info-panel {
      position: absolute;
      top: 64px;
      left: 48px;
      width: min(330px, 23vw);
      max-width: calc(100vw - 96px);
      z-index: 30;
      pointer-events: none;
    }

    .song-heading {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.3vw, 2.6rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: 28px;
      word-break: keep-all;
      overflow-wrap: normal;
      white-space: normal;
      hyphens: none;
    }

    .metadata-table {
      width: 100%;
      border-top: 1px solid var(--border-color);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .meta-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.55;
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.95rem;
      text-align: right;
      letter-spacing: 0.01em;
      font-family: var(--font-serif);
    }

    /* ========================================================
       BOTTOM REVIEWS SECTION (Positioned under Active CD)
       ======================================================== */
    .reviews-container {
      position: absolute;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 64px;
      z-index: 25;
      pointer-events: none;
      text-align: center;
    }

    .review-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 250px;
    }

    .review-stars {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      color: #000;
      font-size: 0.82rem;
    }

    .review-pub {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.6;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .review-quote {
      font-family: var(--font-serif);
      font-size: 1.12rem;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    /* ========================================================
       FLOATING AUDIO PLAYER CONTROLS (Lower-Left Corner)
       ======================================================== */
    .audio-player-dock {
      position: absolute;
      bottom: 40px;
      left: 48px;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 18px 8px 10px;
      border-radius: 40px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
    }

    .play-trigger {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1), background 0.25s;
    }
    .play-trigger:hover {
      transform: scale(1.08);
      background: #e63946;
    }
    .play-trigger svg {
      width: 16px;
      height: 16px;
      margin-left: 2px;
    }
    .play-trigger.is-playing svg {
      margin-left: 0;
    }

    .player-track-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 140px;
    }
    .player-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .player-progress-fill {
      width: 0%;
      height: 100%;
      background: #111;
      border-radius: 2px;
    }
    .player-time {
      font-size: 0.65rem;
      opacity: 0.6;
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: space-between;
    }

    /* 3D WebGL Canvas Layer */
    #webgl-canvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="grain"></div>

  <!-- Background Tint Overlay -->
  <div class="page-bg" id="page-backdrop"></div>

  <!-- Navigation Bar (1:1 with authentic A24) -->
  <header class="nav" id="main-nav">
    <div class="nav-bg" aria-hidden="true"></div>

    <div class="nav-container">
      <a href="#" class="nav-logo" id="nav-logo-btn" aria-label="AuriX">AuriX</a>
      <ul class="nav-links">
        <li class="nav-item">
          <a href="#" class="nav-link active" id="nav-songs-btn">Songs</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" id="nav-artists-btn">Artists</a>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="dropdown-toggle" data-dropdown-toggle="closed" aria-expanded="false" aria-haspopup="true">
            <span class="nav-link__label">Index</span>
            <svg class="nav-chevron nav-link__dropdown-icon" viewBox="0 0 10 6" fill="none">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </li>
      </ul>
    </div>

    <!-- Authentic A24 Dropdown Sheet -->
    <div class="nav-dropdown" id="dropdown-roster" aria-hidden="true">
      <div class="nav-dropdown__overflow">
        <div class="nav-dropdown__overflow-inner">
          <div class="nav-dropdown__content" id="dropdown-content-scroller">
            <div class="nav-dropdown__content-li" id="dropdown-items"></div>
          </div>
        </div>
      </div>
      <div class="nav-dropdown__scrollbar" id="dropdown-scrollbar">
        <div class="nav-dropdown__scrollbar-progress" id="dropdown-scroll-thumb"></div>
      </div>
    </div>
  </header>

  <!-- Top-Left Information Table (1:1 with Screenshot) -->
  <div class="hero-info-panel">
    <h1 class="song-heading" id="song-title">CHERRY WAVES</h1>
    <div class="metadata-table">
      <div class="meta-row">
        <span class="meta-label">ARTIST</span>
        <span class="meta-value" id="song-artist">Deftones</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">YEAR</span>
        <span class="meta-value" id="song-year">2006</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">ALBUM</span>
        <span class="meta-value" id="song-album">Saturday Night Wrist</span>
      </div>
    </div>
  </div>

  <!-- Bottom Review Quotes (Positioned Underneath Active Disc) -->
  <div class="reviews-container">
    <div class="review-col">
      <div class="review-stars">★★★★★</div>
      <div class="review-pub" id="rev1-pub">PITCHFORK</div>
      <div class="review-quote" id="rev1-quote">“AN ETHEREAL MASTERPIECE OF DREAMY HEAVY TEXTURES”</div>
    </div>
    <div class="review-col">
      <div class="review-stars">★★★★★</div>
      <div class="review-pub" id="rev2-pub">KERRANG!</div>
      <div class="review-quote" id="rev2-quote">“CHINO MORENO AT HIS MOST HAUNTING AND BEAUTIFUL”</div>
    </div>
  </div>

  <!-- Audio Player Dock -->
  <div class="audio-player-dock">
    <button class="play-trigger" id="audio-play-btn" title="Play Song">
      <svg id="play-svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <div class="player-track-info">
      <div class="player-progress-bar" id="audio-progress-bar">
        <div class="player-progress-fill" id="audio-progress-fill"></div>
      </div>
      <div class="player-time">
        <span id="audio-time-current">0:00</span>
        <span id="audio-time-total">0:00</span>
      </div>
    </div>
  </div>

  <!-- Three.js 3D Viewport -->
  <div id="webgl-canvas"></div>

  <!-- Hidden HTML5 Audio Element -->
  <audio id="real-audio-player" preload="metadata"></audio>

  <!-- Modular AuriX Audio & 3D WebGL Engine -->
  <script src="./js/state.js"></script>
  <script src="./js/navigation.js"></script>
  <script src="./js/audio-player.js"></script>
  <script src="./js/cd-scene.js"></script>
  <script src="./js/scribble.js"></script>
  <script src="./js/carousel.js"></script>
  <script src="./js/interactions.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
