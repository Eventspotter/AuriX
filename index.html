<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuriX — Audiophile CD Experience</title>

  <!-- External libraries -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- High-Fidelity Songs Data with Base64 Album Arts -->
  <script src="./songs-data.js"></script>

  <style>
    @font-face {
      font-family: 'NeueMontreal';
      src: url('./fonts/PPNeueMontreal-Medium.woff2') format('woff2');
      font-weight: 500;
    }
    @font-face {
      font-family: 'PPEiko';
      src: url('./fonts/PPEiko-Regular.woff2') format('woff2');
      font-weight: 400;
    }

    :root {
      --bg-color: #f7f7f6;
      --text-color: #111111;
      --border-color: rgba(0, 0, 0, 0.12);
      --font-serif: 'PPEiko', Georgia, 'Times New Roman', serif;
      --font-sans: 'NeueMontreal', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Film grain texture */
    .grain {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 50;
    }

    /* ========================================================
       TOP NAVIGATION BAR (Centered & Responsive)
       ======================================================== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 36px;
      pointer-events: auto;
    }

    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--text-color);
      cursor: pointer;
      line-height: 1;
      transition: opacity 0.2s ease;
    }

    .nav-logo:hover {
      opacity: 0.65;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
      position: relative;
    }

    .nav-item {
      position: relative;
    }

    .nav-link {
      font-size: 0.95rem;
      color: var(--text-color);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      position: relative;
      transition: opacity 0.2s ease;
    }

    .nav-link:hover {
      opacity: 0.65;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--text-color);
      border-radius: 50%;
    }

    .nav-chevron {
      width: 10px;
      height: 6px;
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .nav-link[data-dropdown-toggle="open"] .nav-chevron {
      transform: rotate(180deg);
    }

    /* Index Dropdown Roster */
    .nav-dropdown {
      position: absolute;
      top: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      width: 320px;
      background: rgba(247, 247, 246, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 0;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 100;
      max-height: 380px;
      overflow-y: auto;
    }

    .nav-dropdown.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .dropdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      font-size: 0.88rem;
      color: var(--text-color);
      text-decoration: none;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .dropdown-item.active {
      font-weight: 600;
      background: rgba(0, 0, 0, 0.07);
    }

    .dropdown-year {
      font-size: 0.75rem;
      opacity: 0.5;
      font-family: var(--font-serif);
    }

    /* ========================================================
       TOP LEFT METADATA PANEL (1:1 with Reference Screenshot)
       Completely safe from any CD overlap
       ======================================================== */
    .hero-info-panel {
      position: absolute;
      top: 64px;
      left: 48px;
      width: min(330px, 23vw);
      max-width: calc(100vw - 96px);
      z-index: 30;
      pointer-events: none;
    }

    .song-heading {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.3vw, 2.6rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: 28px;
      word-break: keep-all;
      overflow-wrap: normal;
      white-space: normal;
      hyphens: none;
    }

    .metadata-table {
      width: 100%;
      border-top: 1px solid var(--border-color);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .meta-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.55;
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.95rem;
      text-align: right;
      letter-spacing: 0.01em;
      font-family: var(--font-serif);
    }

    /* ========================================================
       BOTTOM REVIEWS SECTION (Positioned under Active CD)
       ======================================================== */
    .reviews-container {
      position: absolute;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 64px;
      z-index: 25;
      pointer-events: none;
      text-align: center;
    }

    .review-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 250px;
    }

    .review-stars {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      color: #000;
      font-size: 0.82rem;
    }

    .review-pub {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.6;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .review-quote {
      font-family: var(--font-serif);
      font-size: 1.12rem;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    /* ========================================================
       FLOATING AUDIO PLAYER CONTROLS (Lower-Left Corner)
       ======================================================== */
    .audio-player-dock {
      position: absolute;
      bottom: 40px;
      left: 48px;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 18px 8px 10px;
      border-radius: 40px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
    }

    .play-trigger {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1), background 0.25s;
    }
    .play-trigger:hover {
      transform: scale(1.08);
      background: #e63946;
    }
    .play-trigger svg {
      width: 16px;
      height: 16px;
      margin-left: 2px;
    }
    .play-trigger.is-playing svg {
      margin-left: 0;
    }

    .player-track-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 140px;
    }
    .player-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .player-progress-fill {
      width: 0%;
      height: 100%;
      background: #111;
      border-radius: 2px;
    }
    .player-time {
      font-size: 0.65rem;
      opacity: 0.6;
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: space-between;
    }

    /* 3D WebGL Canvas Layer */
    #webgl-canvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="grain"></div>

  <!-- Navigation Bar (Centered) -->
  <header class="nav">
    <div class="nav-container">
      <a href="#" class="nav-logo" id="nav-logo-btn" aria-label="AuriX">AuriX</a>
      <ul class="nav-links">
        <li class="nav-item">
          <a href="#" class="nav-link active" id="nav-songs-btn">Songs</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" id="nav-artists-btn">Artists</a>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="dropdown-toggle" data-dropdown-toggle="closed">
            <span>Index</span>
            <svg class="nav-chevron" viewBox="0 0 10 6" fill="none">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <!-- Index Dropdown Roster -->
          <div class="nav-dropdown" id="dropdown-roster">
            <div class="dropdown-content" id="dropdown-items"></div>
          </div>
        </li>
      </ul>
    </div>
  </header>

  <!-- Top-Left Information Table (1:1 with Screenshot) -->
  <div class="hero-info-panel">
    <h1 class="song-heading" id="song-title">CHERRY WAVES</h1>
    <div class="metadata-table">
      <div class="meta-row">
        <span class="meta-label">ARTIST</span>
        <span class="meta-value" id="song-artist">Deftones</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">YEAR</span>
        <span class="meta-value" id="song-year">2006</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">ALBUM</span>
        <span class="meta-value" id="song-album">Saturday Night Wrist</span>
      </div>
    </div>
  </div>

  <!-- Bottom Review Quotes (Positioned Underneath Active Disc) -->
  <div class="reviews-container">
    <div class="review-col">
      <div class="review-stars">★★★★★</div>
      <div class="review-pub" id="rev1-pub">PITCHFORK</div>
      <div class="review-quote" id="rev1-quote">“AN ETHEREAL MASTERPIECE OF DREAMY HEAVY TEXTURES”</div>
    </div>
    <div class="review-col">
      <div class="review-stars">★★★★★</div>
      <div class="review-pub" id="rev2-pub">KERRANG!</div>
      <div class="review-quote" id="rev2-quote">“CHINO MORENO AT HIS MOST HAUNTING AND BEAUTIFUL”</div>
    </div>
  </div>

  <!-- Audio Player Dock -->
  <div class="audio-player-dock">
    <button class="play-trigger" id="audio-play-btn" title="Play Song">
      <svg id="play-svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <div class="player-track-info">
      <div class="player-progress-bar" id="audio-progress-bar">
        <div class="player-progress-fill" id="audio-progress-fill"></div>
      </div>
      <div class="player-time">
        <span id="audio-time-current">0:00</span>
        <span id="audio-time-total">0:00</span>
      </div>
    </div>
  </div>

  <!-- Three.js 3D Viewport -->
  <div id="webgl-canvas"></div>

  <!-- Hidden HTML5 Audio Element -->
  <audio id="real-audio-player" preload="metadata"></audio>

  <script>
    gsap.registerPlugin(CustomEase);
    CustomEase.create("aurixGlide", "0.32, 0.72, 0, 1");

    // Retrieve songs array from songs-data.js
    const SONGS = (typeof AURIX_SONGS !== 'undefined' ? AURIX_SONGS : (window.AURIX_SONGS || []));

    let activeIndex = 0;
    let carouselOffset = 0;
    let targetCarouselOffset = 0;
    const discMeshes = [];

    /* ========================================================
       INDEX DROPDOWN ROSTER
       ======================================================== */
    const dropdownToggle = document.getElementById('dropdown-toggle');
    const dropdownRoster = document.getElementById('dropdown-roster');
    const dropdownItemsContainer = document.getElementById('dropdown-items');
    const navSongsBtn = document.getElementById('nav-songs-btn');
    const navArtistsBtn = document.getElementById('nav-artists-btn');
    const navLogoBtn = document.getElementById('nav-logo-btn');

    let currentSortMode = 'songs';

    function renderDropdownItems() {
      dropdownItemsContainer.innerHTML = '';
      SONGS.forEach((song, idx) => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = `dropdown-item ${idx === activeIndex ? 'active' : ''}`;
        if (currentSortMode === 'artists') {
          a.innerHTML = `
            <span class="dropdown-title">${song.artist} — ${song.title}</span>
            <span class="dropdown-year">${song.year}</span>
          `;
        } else {
          a.innerHTML = `
            <span class="dropdown-title">${song.title}</span>
            <span class="dropdown-year">${song.artist}</span>
          `;
        }
        a.addEventListener('click', (e) => {
          e.preventDefault();
          selectSong(idx);
          closeDropdown();
        });
        dropdownItemsContainer.appendChild(a);
      });
    }

    renderDropdownItems();

    let isDropdownOpen = false;
    function openDropdown() {
      isDropdownOpen = true;
      dropdownToggle.setAttribute('data-dropdown-toggle', 'open');
      dropdownRoster.classList.add('is-open');
    }
    function closeDropdown() {
      isDropdownOpen = false;
      dropdownToggle.setAttribute('data-dropdown-toggle', 'closed');
      dropdownRoster.classList.remove('is-open');
    }
    dropdownToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      isDropdownOpen ? closeDropdown() : openDropdown();
    });
    document.addEventListener('click', (e) => {
      if (!dropdownRoster.contains(e.target) && !dropdownToggle.contains(e.target)) {
        closeDropdown();
      }
    });

    if (navSongsBtn) {
      navSongsBtn.addEventListener('click', (e) => {
        e.preventDefault();
        currentSortMode = 'songs';
        navSongsBtn.classList.add('active');
        if (navArtistsBtn) navArtistsBtn.classList.remove('active');
        renderDropdownItems();
        openDropdown();
      });
    }

    if (navArtistsBtn) {
      navArtistsBtn.addEventListener('click', (e) => {
        e.preventDefault();
        currentSortMode = 'artists';
        navArtistsBtn.classList.add('active');
        if (navSongsBtn) navSongsBtn.classList.remove('active');
        renderDropdownItems();
        openDropdown();
      });
    }

    if (navLogoBtn) {
      navLogoBtn.addEventListener('click', (e) => {
        e.preventDefault();
        selectSong(0);
      });
    }

    /* ========================================================
       REAL AUDIO PLAYER LOGIC
       ======================================================== */
    const audio = document.getElementById('real-audio-player');
    const playBtn = document.getElementById('audio-play-btn');
    const playSvg = document.getElementById('play-svg');
    const progressBar = document.getElementById('audio-progress-bar');
    const progressFill = document.getElementById('audio-progress-fill');
    const timeCurrent = document.getElementById('audio-time-current');
    const timeTotal = document.getElementById('audio-time-total');

    let isAudioPlaying = false;

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function loadAudioTrack(idx, autoPlay = false) {
      const song = SONGS[idx];
      audio.src = song.audioSrc;
      audio.load();
      if (autoPlay) {
        audio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
      } else {
        setPlayState(false);
      }
    }

    function setPlayState(playing) {
      isAudioPlaying = playing;
      playBtn.classList.toggle('is-playing', playing);
      playSvg.innerHTML = playing
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' // Pause icon
        : '<path d="M8 5v14l11-7z"/>';                  // Play icon
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => setPlayState(true)).catch(console.error);
      } else {
        audio.pause();
        setPlayState(false);
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${progress}%`;
      timeCurrent.textContent = formatTime(audio.currentTime);
      timeTotal.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      selectSong((activeIndex + 1) % SONGS.length, true);
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    /* ========================================================
       INDIVIDUAL CD CANVAS TEXTURE GENERATOR (1024x1024)
       Every single CD gets its own dedicated canvas rendering
       its true extracted album cover artwork and vinyl sheen.
       ======================================================== */
    function createCDTextureForSong(song) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        const center = 512;
        const outerR = 512;
        const hubR = Math.round(512 * 0.24); // 123px (A24 exact hub boundary)

        let rendered = false;
        function doRender() {
          if (rendered) return;
          rendered = true;
          renderCanvas();
        }

        const img = new Image();
        img.onload = doRender;
        img.onerror = doRender;

        function renderCanvas() {
          ctx.clearRect(0, 0, 1024, 1024);

          // 1. Circular disc clip (printed area between hubR=123 and outerR=512)
          ctx.save();
          ctx.beginPath();
          ctx.arc(center, center, outerR, 0, Math.PI * 2);
          ctx.arc(center, center, hubR, 0, Math.PI * 2, true);
          ctx.clip('evenodd');

          // 2. Base Disc background color
          ctx.fillStyle = song.bgColor || "#0c0c0e";
          ctx.fillRect(0, 0, 1024, 1024);

          // 3. FULL HIGH-RESOLUTION ALBUM ARTWORK
          if (img.complete && img.naturalWidth > 0) {
            ctx.save();
            ctx.globalAlpha = 0.98;
            const scale = Math.max(1024 / img.naturalWidth, 1024 / img.naturalHeight);
            const w = img.naturalWidth * scale;
            const h = img.naturalHeight * scale;
            ctx.drawImage(img, (1024 - w) / 2, (1024 - h) / 2, w, h);
            ctx.restore();

            // Contrast vignette
            const vignette = ctx.createRadialGradient(center, center, hubR + 10, center, center, outerR);
            vignette.addColorStop(0, "rgba(0,0,0,0.05)");
            vignette.addColorStop(0.7, "rgba(0,0,0,0.2)");
            vignette.addColorStop(1, "rgba(0,0,0,0.5)");
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, 1024, 1024);
          }

          // 4. Subtle Concentric Disc Grooves
          ctx.save();
          for (let r = hubR + 12; r < outerR - 8; r += 6) {
            ctx.lineWidth = 0.8;
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.02 + Math.sin(r * 0.5) * 0.015})`;
            ctx.beginPath();
            ctx.arc(center, center, r, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();

          // 5. Stylized Stamp on Disc Face
          ctx.save();
          ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
          ctx.shadowBlur = 10;

          // If fallback (no image), render title and artist
          if (!img.complete || img.naturalWidth === 0) {
            ctx.fillStyle = song.textColor || "#ffffff";
            ctx.font = "bold 56px 'PPEiko', Georgia, serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const words = song.title.split(' ');
            if (words.length > 2) {
              const mid = Math.ceil(words.length / 2);
              ctx.fillText(words.slice(0, mid).join(' '), center, center - 60);
              ctx.fillText(words.slice(mid).join(' '), center, center + 45);
            } else {
              ctx.fillText(song.title, center, center - 40);
            }

            // Artist name
            ctx.font = "600 22px 'NeueMontreal', sans-serif";
            ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
            ctx.fillText(song.artist.toUpperCase(), center, center + 120);
          }

          // AuriX Brand stamp
          ctx.font = "bold 28px 'PPEiko', serif";
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.fillText("AuriX", center, 855);
          ctx.restore();

          // 6. Circular Rim Text
          ctx.save();
          ctx.font = "600 12px 'NeueMontreal', sans-serif";
          ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
          ctx.textAlign = "center";
          const rimText = `AuriX MASTER CD • ${song.artist.toUpperCase()} • ${song.album.toUpperCase()} • STEREO • LOSSLESS 24-BIT`;
          drawCurvedText(ctx, rimText, center, center, outerR - 22, -Math.PI * 0.85);
          ctx.restore();

          ctx.restore(); // end clip

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          texture.needsUpdate = true;
          resolve(texture);
        }

        // Trigger load via base64 data URL or local artwork file
        img.src = song.artDataUrl || song.artFile;
        if (img.complete && img.naturalWidth > 0) {
          doRender();
        }
      });
    }

    function drawCurvedText(ctx, text, x, y, radius, startAngle) {
      const step = 0.038;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const angle = startAngle + i * step;
        ctx.save();
        ctx.translate(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius);
        ctx.rotate(angle + Math.PI / 2);
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }
    }

    /* ========================================================
       3D THREE.JS OPTICAL DISC ARC ENGINE (Reverse Engineered)
       Exact parameters: galleryRotX: -26, galleryRotY: -28,
       cameraDistance: 4.4, cameraFOV: 40, galleryScale: 1.05.
       Active CD center at x ~ 0.65, y ~ 0.12 (Zero overlap with HUD!)
       ======================================================== */
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 4.4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.86;
    container.appendChild(renderer.domElement);

    // Value noise helper for micro-textures
    function valueNoise(x, y) {
      const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return v - Math.floor(v);
    }

    // Procedural CD Surface Maps (Micro-grooves, ink grain, gloss variations)
    function createCDMaps() {
      const size = 512;
      const center = size / 2;

      // 1. Front Normal Map (optical micro-grooves & printing texture)
      const fNormCanvas = document.createElement('canvas');
      fNormCanvas.width = size;
      fNormCanvas.height = size;
      const fNormCtx = fNormCanvas.getContext('2d');
      const fNormImgData = fNormCtx.createImageData(size, size);
      const fNormData = fNormImgData.data;
      const heightMap = new Float32Array(size * size);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = x - center;
          const dy = y - center;
          const r = Math.sqrt(dx * dx + dy * dy) + 0.0001;
          const optical = Math.sin(r * 0.6) * 0.025;
          const ink = (valueNoise(x * 0.4, y * 0.4) - 0.5) * 0.175;
          heightMap[y * size + x] = optical + ink;
        }
      }

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const left = heightMap[y * size + Math.max(0, x - 1)];
          const right = heightMap[y * size + Math.min(size - 1, x + 1)];
          const up = heightMap[Math.max(0, y - 1) * size + x];
          const down = heightMap[Math.min(size - 1, y + 1) * size + x];
          let nx = left - right, ny = up - down, nz = 1;
          const inv = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz);
          const idx = (y * size + x) * 4;
          fNormData[idx] = (nx * inv * 0.5 + 0.5) * 255;
          fNormData[idx + 1] = (ny * inv * 0.5 + 0.5) * 255;
          fNormData[idx + 2] = (nz * inv * 0.5 + 0.5) * 255;
          fNormData[idx + 3] = 255;
        }
      }
      fNormCtx.putImageData(fNormImgData, 0, 0);
      const frontNormalMap = new THREE.CanvasTexture(fNormCanvas);

      // 2. Front Roughness Map (Radial variation & sheen contrast)
      const fRoughCanvas = document.createElement('canvas');
      fRoughCanvas.width = size;
      fRoughCanvas.height = size;
      const fRoughCtx = fRoughCanvas.getContext('2d');
      const fRoughImgData = fRoughCtx.createImageData(size, size);
      const fRoughData = fRoughImgData.data;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = x - center;
          const dy = y - center;
          const rNorm = Math.sqrt(dx * dx + dy * dy) / (size * 0.5);
          let roughness = 0.42;
          roughness += (valueNoise(x * 2.3, y * 2.3) - 0.5) * 0.2;
          roughness -= (Math.sin(rNorm * 14) * 0.5 + 0.5) * 0.25;
          roughness = Math.max(0.04, Math.min(1.0, roughness));
          const val = roughness * 255;
          const idx = (y * size + x) * 4;
          fRoughData[idx] = val;
          fRoughData[idx + 1] = val;
          fRoughData[idx + 2] = val;
          fRoughData[idx + 3] = 255;
        }
      }
      fRoughCtx.putImageData(fRoughImgData, 0, 0);
      const frontRoughMap = new THREE.CanvasTexture(fRoughCanvas);

      return { frontNormalMap, frontRoughMap };
    }

    const cdMaps = createCDMaps();

    // Procedural Studio Reflection Environment (A24 studio softbox bars)
    function createEnvironmentTexture(rend) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, 0, 512);
      bg.addColorStop(0, '#25282f');
      bg.addColorStop(0.5, '#0e0f13');
      bg.addColorStop(1, '#020203');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1024, 512);

      const r = 0.07;
      [[0.14, r, 1.0], [0.4, r * 0.7, 0.6], [0.26, r * 1.1, 0.85], [0.62, r * 0.5, 0.35]].forEach(([pos, halfW, intensity]) => {
        const topY = 512 * (pos - halfW);
        const botY = 512 * (pos + halfW);
        const stripGrad = ctx.createLinearGradient(0, topY, 0, botY);
        stripGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        stripGrad.addColorStop(0.5, `rgba(255, 255, 255, ${Math.max(0.1, 0.95 * intensity)})`);
        stripGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = stripGrad;
        ctx.fillRect(0, topY, 1024, botY - topY);
      });

      const envTex = new THREE.CanvasTexture(canvas);
      envTex.mapping = THREE.EquirectangularReflectionMapping;
      const pmrem = new THREE.PMREMGenerator(rend);
      const envMap = pmrem.fromEquirectangular(envTex);
      envTex.dispose();
      pmrem.dispose();
      return envMap.texture;
    }

    // Studio Environment Reflections
    scene.environment = createEnvironmentTexture(renderer);
    scene.environmentIntensity = 1.0;

    // Authentic A24 Studio Lighting Rig
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff9e8, 0.75);
    keyLight.position.set(3.5, -8, 6);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
    fillLight.position.set(-5, -2, 4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x499ff5, 0.75);
    rimLight.position.set(0, 3, -6);
    scene.add(rimLight);

    // Specular Glint Strip Light (sweeps across CD faces during 3D hover tilt)
    const topStripLight = new THREE.DirectionalLight(0xffffff, 1.9);
    topStripLight.position.set(0, 3.2, 3);
    scene.add(topStripLight);

    // Exact A24 Disc Dimensions: Outer R = 1.0, Hub R = 0.24, Hole R = 0.14
    const DISC_OUTER_R = 1.0;
    const DISC_HUB_R = 0.24;
    const DISC_HOLE_R = 0.14;

    function remapRingUVs(geom) {
      const pos = geom.attributes.position;
      const uvs = geom.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i) * 0.5 + 0.5;
        const v = pos.getY(i) * 0.5 + 0.5;
        uvs.setXY(i, u, v);
      }
      uvs.needsUpdate = true;
    }

    const frontRingGeom = new THREE.RingGeometry(0.24, 1.0, 220, 1);
    remapRingUVs(frontRingGeom);

    const backRingGeom = new THREE.RingGeometry(0.24, 1.0, 220, 1);
    remapRingUVs(backRingGeom);

    // Inner Disc Geometry Layers (Frost Ring, Matrix Mirror Band, Polycarbonate Hub)
    const frostGeom = new THREE.RingGeometry(0.14, 0.174, 120, 1);
    const matrixGeom = new THREE.RingGeometry(0.174, 0.214, 120, 1);
    const hubGeom = new THREE.RingGeometry(0.214, 0.24, 120, 1);

    // Outer Rim Bevel
    const rimShape = new THREE.Shape();
    rimShape.absarc(0, 0, DISC_OUTER_R, 0, Math.PI * 2, false);
    const rimHole = new THREE.Path();
    rimHole.absarc(0, 0, DISC_OUTER_R - 0.012, 0, Math.PI * 2, true);
    rimShape.holes.push(rimHole);
    const rimGeom = new THREE.ExtrudeGeometry(rimShape, { depth: 0.015, bevelEnabled: false });
    rimGeom.center();

    // Matrix Ring Texture Generator (Silver mirror with laser track markings)
    function createMatrixCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 40.96, 256, 256, 256);
      grad.addColorStop(0, '#d9dde4');
      grad.addColorStop(0.42, '#f0f2f5');
      grad.addColorStop(0.72, '#cfd4dc');
      grad.addColorStop(1, '#b8bec8');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      ctx.lineWidth = 1;
      [0.255, 0.285, 0.315, 0.345].forEach((e, n) => {
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.14 - n * 0.018})`;
        ctx.beginPath();
        ctx.arc(256, 256, 512 * e, 0, Math.PI * 2);
        ctx.stroke();
      });
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const matrixTexture = createMatrixCanvas();

    // Authentic A24 Materials
    const backIridescentMat = new THREE.MeshPhysicalMaterial({
      color: 0x1a1e2a,
      metalness: 1.0,
      roughness: 0.23,
      roughnessMap: cdMaps.frontRoughMap,
      normalMap: cdMaps.frontNormalMap,
      normalScale: new THREE.Vector2(0.5, 0.5),
      clearcoat: 0.34,
      clearcoatRoughness: 0.06,
      iridescence: 1.0,
      iridescenceIOR: 1.86,
      iridescenceThicknessRange: [140, 900],
      envMapIntensity: 1.5,
      side: THREE.DoubleSide
    });

    const rimMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.55,
      roughness: 0.04,
      clearcoat: 0.7,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.8,
      side: THREE.DoubleSide
    });

    const hubMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: 0.14,
      metalness: 0,
      transmission: 0.68,
      thickness: 0.6,
      ior: 1.5,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      envMapIntensity: 1.3,
      transparent: true,
      side: THREE.DoubleSide
    });

    const matrixMat = new THREE.MeshPhysicalMaterial({
      color: 0xdfdfeb,
      map: matrixTexture,
      roughness: 0.28,
      metalness: 0.82,
      clearcoat: 0.7,
      clearcoatRoughness: 0.12,
      envMapIntensity: 1.45,
      side: THREE.DoubleSide
    });

    const frostMat = new THREE.MeshPhysicalMaterial({
      color: 0xeeeeee,
      roughness: 0.55,
      metalness: 0,
      transmission: 0.23,
      thickness: 0.3,
      ior: 1.5,
      clearcoat: 0.4,
      clearcoatRoughness: 0.3,
      envMapIntensity: 0.9,
      transparent: true,
      side: THREE.DoubleSide
    });

    // Gallery Root Group (Exact 1:1 A24 reverse-engineered parameters)
    const galleryGroup = new THREE.Group();
    galleryGroup.rotation.x = THREE.MathUtils.degToRad(-30);
    galleryGroup.rotation.y = THREE.MathUtils.degToRad(-30);
    galleryGroup.position.set(0, 0, 0);
    galleryGroup.scale.setScalar(1.08);
    scene.add(galleryGroup);

    /* ========================================================
       AUTHENTIC A24 HOVER SCRIBBLE (Stop-Motion Hand-Drawn Outline)
       ======================================================== */
    const scribbleConfig = {
      enabled: true,
      color: 0x000000,
      fps: 10,                 // 10 FPS choppy stop-motion sketch aesthetic
      points: 24,              // Organic jitter control nodes
      jitter: 0.034,           // Random radius wobbliness
      loops: 2,                // Dual concentric sketch loops
      loopGap: 0.045,          // Spacing between the dual sketched outlines
      padding: 0.05,           // Offset from the CD outer boundary
      width: 0.018,            // Tapered stroke thickness
      sweep: 0.76,             // Arc length around disc (76%)
      sweepJitter: 0.35,       // Random sweep arc variation
      inSteps: [0.35, 0.65, 0.9, 1.0],
      outSteps: [0.75, 0.45, 0.2]
    };

    const scribbleGroup = new THREE.Group();
    scribbleGroup.visible = false;
    scribbleGroup.renderOrder = 999;
    galleryGroup.add(scribbleGroup);

    const scribbleMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(scribbleConfig.color),
      side: THREE.DoubleSide,
      depthWrite: false,
      depthTest: true,
      transparent: true,
      toneMapped: false
    });

    const scribbleGeometries = [];
    const N_SEGMENTS = scribbleConfig.points * 3; // 72 fine segments per loop

    for (let l = 0; l < scribbleConfig.loops; l++) {
      const geom = new THREE.BufferGeometry();
      const totalVerts = (N_SEGMENTS + 1) * 2;
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(totalVerts * 3), 3));
      const indices = [];
      for (let s = 0; s < N_SEGMENTS; s++) {
        const idx = s * 2;
        indices.push(idx, idx + 1, idx + 2, idx + 1, idx + 3, idx + 2);
      }
      geom.setIndex(indices);
      scribbleGeometries.push(geom);

      const mesh = new THREE.Mesh(geom, scribbleMaterial);
      mesh.renderOrder = 999;
      scribbleGroup.add(mesh);
    }

    function updateScribbleStroke(loopIdx, progress) {
      const geom = scribbleGeometries[loopIdx];
      const posAttr = geom.getAttribute('position');

      const baseRadius = DISC_OUTER_R * (1 + scribbleConfig.padding + loopIdx * scribbleConfig.loopGap);
      const halfWidth = DISC_OUTER_R * scribbleConfig.width * 0.5;

      const sweepFactor = Math.max(0.12, Math.min(1.0, scribbleConfig.sweep * (1 + (Math.random() - 0.5) * scribbleConfig.sweepJitter))) * progress;
      const sweepAngle = Math.PI * 2 * sweepFactor;
      const startAngle = Math.random() * Math.PI * 2;

      const jitterNodes = [];
      for (let p = 0; p <= scribbleConfig.points; p++) {
        jitterNodes.push(1 + (Math.random() - 0.5) * 2 * scribbleConfig.jitter);
      }

      for (let s = 0; s <= N_SEGMENTS; s++) {
        const t = s / N_SEGMENTS;
        const angle = startAngle + t * sweepAngle;

        const u = t * scribbleConfig.points * sweepFactor;
        const d = Math.floor(u);
        const f = Math.min(scribbleConfig.points, d + 1);
        const p = u - d;
        const smooth = p * p * (3 - 2 * p); // smoothstep
        const jitterMult = jitterNodes[d] * (1 - smooth) + jitterNodes[f] * smooth;

        // Natural tapered stroke ends (thick in middle, tapered at tips)
        const taper = Math.min(1.0, Math.min(t, 1 - t) * 14 + 0.15);
        const innerR = baseRadius * jitterMult - halfWidth * taper;
        const outerR = baseRadius * jitterMult + halfWidth * taper;

        const cosA = Math.cos(angle);
        const sinA = Math.sin(angle);

        // Position slightly in front of disc front label to prevent clipping
        posAttr.setXYZ(s * 2, cosA * innerR, sinA * innerR, 0.022);
        posAttr.setXYZ(s * 2 + 1, cosA * outerR, sinA * outerR, 0.022);
      }

      posAttr.needsUpdate = true;
      geom.computeBoundingSphere();
    }

    function refreshScribble(progress = 1.0) {
      for (let l = 0; l < scribbleGeometries.length; l++) {
        updateScribbleStroke(l, progress);
      }
    }

    let hoveredDiscIndex = -1;
    let scribbleTargetIndex = -1;
    let scribbleState = 'hidden'; // 'hidden' | 'in' | 'on' | 'out'
    let scribbleStep = 0;
    let lastScribbleTime = 0;

    function snapScribbleToTarget(targetMesh, instant = false) {
      if (!targetMesh) return;
      if (instant) {
        scribbleGroup.position.copy(targetMesh.position);
        scribbleGroup.quaternion.copy(targetMesh.quaternion);
        scribbleGroup.scale.copy(targetMesh.scale);
      } else {
        scribbleGroup.position.lerp(targetMesh.position, 0.45);
        scribbleGroup.quaternion.slerp(targetMesh.quaternion, 0.45);
        scribbleGroup.scale.lerp(targetMesh.scale, 0.45);
      }
    }

    function updateScribbleAnimation(now) {
      const frameInterval = 1000 / scribbleConfig.fps;
      const isDue = (now - lastScribbleTime) >= frameInterval;

      // Only the currently active / playing CD should display the scribble animation
      const isTargetActive = (hoveredDiscIndex !== -1 && hoveredDiscIndex === activeIndex);

      if (isTargetActive) {
        if (scribbleState === 'hidden' || scribbleTargetIndex !== hoveredDiscIndex) {
          scribbleTargetIndex = hoveredDiscIndex;
          scribbleState = 'in';
          scribbleStep = 0;
          scribbleGroup.visible = true;
          snapScribbleToTarget(discMeshes[scribbleTargetIndex], true);
          refreshScribble(scribbleConfig.inSteps[0]);
          lastScribbleTime = now;
        } else {
          snapScribbleToTarget(discMeshes[scribbleTargetIndex], false);

          if (isDue) {
            lastScribbleTime = now;
            if (scribbleState === 'in') {
              scribbleStep++;
              if (scribbleStep < scribbleConfig.inSteps.length) {
                refreshScribble(scribbleConfig.inSteps[scribbleStep]);
              } else {
                scribbleState = 'on';
                refreshScribble(1.0);
              }
            } else {
              refreshScribble(1.0);
            }
          }
        }
      } else {
        if (scribbleState !== 'hidden') {
          snapScribbleToTarget(discMeshes[scribbleTargetIndex], false);

          if (scribbleState !== 'out') {
            scribbleState = 'out';
            scribbleStep = 0;
          }

          if (isDue) {
            lastScribbleTime = now;
            if (scribbleStep < scribbleConfig.outSteps.length) {
              refreshScribble(scribbleConfig.outSteps[scribbleStep]);
              scribbleStep++;
            } else {
              scribbleState = 'hidden';
              scribbleTargetIndex = -1;
              scribbleGroup.visible = false;
            }
          }
        }
      }
    }

    // Load textures and assemble 3D CDs
    async function initCDs() {
      const texturePromises = [];

      for (let i = 0; i < SONGS.length; i++) {
        const song = SONGS[i];
        const cdMeshGroup = new THREE.Group();

        // Separate spin group so axial spin does not interfere with 3D hover tilt
        const spinGroup = new THREE.Group();
        cdMeshGroup.add(spinGroup);

        // 1. Front printed label with unique cover art + satin metallic micro-groove sheen
        const frontMat = new THREE.MeshPhysicalMaterial({
          roughness: 0.42,

          normalMap: cdMaps.frontNormalMap,

          clearcoat: 0.8,

          side: THREE.FrontSide
        });
        const frontMesh = new THREE.Mesh(frontRingGeom, frontMat);
        frontMesh.position.z = 0.006;
        spinGroup.add(frontMesh);

        // 2. Back silver optical data surface with rainbow diffraction
        const backMesh = new THREE.Mesh(backRingGeom, backIridescentMat);
        backMesh.position.z = -0.006;
        backMesh.rotation.y = Math.PI;
        spinGroup.add(backMesh);

        // 3. Center Hub System (Frosted Ring, Silver Matrix Band, Polycarbonate Hub)
        const frostMesh = new THREE.Mesh(frostGeom, frostMat);
        spinGroup.add(frostMesh);

        const matrixMesh = new THREE.Mesh(matrixGeom, matrixMat);
        spinGroup.add(matrixMesh);

        const hubMesh = new THREE.Mesh(hubGeom, hubMat);
        spinGroup.add(hubMesh);

        // 4. Outer Polycarbonate Bevel Rim
        const rimMesh = new THREE.Mesh(rimGeom, rimMat);
        spinGroup.add(rimMesh);

        cdMeshGroup.userData = {
          index: i,
          song: song,
          spinGroup: spinGroup,
          baseRotX: 0,
          baseRotY: 0,
          baseRotZ: 0,
          basePosZ: 0,
          baseScale: 1,
          hover: 0,
          targetHover: 0,
          tiltX: 0,
          tiltY: 0,
          targetTiltX: 0,
          targetTiltY: 0
        };
        galleryGroup.add(cdMeshGroup);
        discMeshes.push(cdMeshGroup);

        // Load textures in parallel and apply immediately
        texturePromises.push(
          createCDTextureForSong(song).then((tex) => {
            frontMat.map = tex;
            frontMat.needsUpdate = true;
          })
        );
      }

      updateDiscArc();
      loadAudioTrack(0, false);
      await Promise.all(texturePromises);
    }

    /* ========================================================
       DISC ARC TRAJECTORY & PROPER SPACING
       Calculates smooth swoop across the 3D space
       ======================================================== */
    function updateDiscArc() {
      const N = discMeshes.length;

      discMeshes.forEach((mesh, i) => {
        const m = i - carouselOffset;
        const absDelta = Math.abs(m);
        const isActive = absDelta < 0.35;

        // Mathematical arc formula derived from authentic A24 site:
        const theta = m * 0.35;
        const x = Math.sin(theta) * 5.52;
        const y = Math.max(0, 0.06 * (1.0 - absDelta));
        const z = -Math.cos(theta) * 2.4 + 2.4;
        const s = Math.max(0.8, 1.0 - absDelta * 0.2);

        mesh.userData.baseRotX = 0;
        mesh.userData.baseRotY = -theta;
        mesh.userData.baseRotZ = 0;
        mesh.userData.basePosZ = z;
        mesh.userData.baseScale = s;

        mesh.position.set(x, y, z);
        mesh.scale.set(s, s, s);
        mesh.rotation.set(0, -theta, 0);

        // Hide discs that are far offscreen
        mesh.visible = absDelta < 4.0;
      });
    }

    function selectSong(idx, playImmediately = true) {
      activeIndex = idx;
      targetCarouselOffset = idx;

      // Update Top-Left HUD with GSAP
      const song = SONGS[idx];
      gsap.to('#song-title, #song-artist, #song-year, #song-album, #rev1-pub, #rev1-quote, #rev2-pub, #rev2-quote', {
        opacity: 0,
        y: -6,
        duration: 0.18,
        onComplete: () => {
          document.getElementById('song-title').textContent = song.title;
          document.getElementById('song-artist').textContent = song.artist;
          document.getElementById('song-year').textContent = song.year;
          document.getElementById('song-album').textContent = song.album;

          document.getElementById('rev1-pub').textContent = song.reviews[0].pub;
          document.getElementById('rev1-quote').textContent = `“${song.reviews[0].quote}”`;
          document.getElementById('rev2-pub').textContent = song.reviews[1].pub;
          document.getElementById('rev2-quote').textContent = `“${song.reviews[1].quote}”`;

          gsap.to('#song-title, #song-artist, #song-year, #song-album, #rev1-pub, #rev1-quote, #rev2-pub, #rev2-quote', {
            opacity: 1,
            y: 0,
            duration: 0.45,
            stagger: 0.02,
            ease: "aurixGlide"
          });
        }
      });

      // Update Dropdown Active state
      Array.from(dropdownItemsContainer.children).forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      // Smooth glide carousel
      gsap.to({ val: carouselOffset }, {
        val: targetCarouselOffset,
        duration: 0.95,
        ease: "aurixGlide",
        onUpdate: function() {
          carouselOffset = this.targets()[0].val;
          updateDiscArc();
        }
      });

      // Load & Play Audio
      loadAudioTrack(idx, playImmediately);
    }

    function snapToNearest() {
      const nearestIdx = Math.max(0, Math.min(SONGS.length - 1, Math.round(targetCarouselOffset)));

      gsap.to({ val: targetCarouselOffset }, {
        val: nearestIdx,
        duration: 0.85,
        ease: "aurixGlide",
        onUpdate: function() {
          carouselOffset = this.targets()[0].val;
          updateDiscArc();
        },
        onComplete: () => {
          if (nearestIdx !== activeIndex) {
            selectSong(nearestIdx, isAudioPlaying);
          }
        }
      });
    }

    /* ========================================================
       INTUITIVE USER INTERACTIONS (Drag, Scroll, Click, Keys)
       ======================================================== */
    let isDragging = false;
    let hasDragged = false;
    let startX = 0;
    let prevOffset = 0;

    // Raycaster for CD hover, tilt and selection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function getDiscIntersection(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(discMeshes, true);
      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && obj !== galleryGroup) {
          if (obj.userData && obj.userData.index !== undefined) {
            return { index: obj.userData.index, point: intersects[0].point };
          }
          obj = obj.parent;
        }
      }
      return null;
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.nav') || e.target.closest('.audio-player-dock') || e.target.closest('.nav-dropdown')) return;
      isDragging = true;
      hasDragged = false;
      startX = e.clientX;
      prevOffset = targetCarouselOffset;
    });

    window.addEventListener('pointermove', (e) => {
      if (isDragging) {
        if (Math.abs(e.clientX - startX) > 6) {
          hasDragged = true;
        }
        const dx = (e.clientX - startX) / (window.innerWidth * 0.45);
        targetCarouselOffset = Math.max(-0.15, Math.min(SONGS.length - 0.85, prevOffset - dx));
        carouselOffset = targetCarouselOffset;
        updateDiscArc();
        discMeshes.forEach((m) => {
          m.userData.targetHover = 0;
          m.userData.targetTiltX = 0;
          m.userData.targetTiltY = 0;
        });
        hoveredDiscIndex = -1;
        return;
      }

      // Check if mouse is hovering over floating HTML overlays
      if (e.target.closest('.nav, .audio-player-dock, .hero-info-panel, .nav-dropdown')) {
        discMeshes.forEach((m) => {
          m.userData.targetHover = 0;
          m.userData.targetTiltX = 0;
          m.userData.targetTiltY = 0;
        });
        hoveredDiscIndex = -1;
        renderer.domElement.style.cursor = 'default';
        return;
      }

      // Raycast against all CD discs for interactive 3D tilt & scribble
      const hit = getDiscIntersection(e.clientX, e.clientY);
      const hitIdx = hit ? hit.index : -1;

      discMeshes.forEach((mesh, idx) => {
        if (idx === hitIdx && hit.point) {
          // Calculate contact point relative to the hovered disc in its own local coordinates [-1, 1]
          const localHit = mesh.worldToLocal(hit.point.clone());
          const nx = Math.max(-1, Math.min(1, localHit.x));
          const ny = Math.max(-1, Math.min(1, localHit.y));

          // Authentic A24 subtle tilt towards cursor (~0.055 rad ≈ 3.1 degrees)
          mesh.userData.targetHover = 1.0;
          mesh.userData.targetTiltY = nx * 0.055;
          mesh.userData.targetTiltX = -ny * 0.055;
        } else {
          mesh.userData.targetHover = 0.0;
          mesh.userData.targetTiltX = 0;
          mesh.userData.targetTiltY = 0;
        }
      });

      // Authentic A24 scribble outline is exclusively on the active / playing CD
      hoveredDiscIndex = (hitIdx === activeIndex) ? activeIndex : -1;
      renderer.domElement.style.cursor = (hitIdx !== -1) ? 'pointer' : 'default';
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;
      snapToNearest();
    });

    window.addEventListener('pointerleave', () => {
      discMeshes.forEach((m) => {
        m.userData.targetHover = 0;
        m.userData.targetTiltX = 0;
        m.userData.targetTiltY = 0;
      });
      hoveredDiscIndex = -1;
      if (renderer.domElement) {
        renderer.domElement.style.cursor = 'default';
      }
    });

    // Wheel Scroll support
    let wheelTimeout;
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.nav-dropdown')) return;
      e.preventDefault();
      targetCarouselOffset = Math.max(0, Math.min(SONGS.length - 1, targetCarouselOffset + Math.sign(e.deltaY || e.deltaX) * 0.35));
      carouselOffset = targetCarouselOffset;
      updateDiscArc();

      clearTimeout(wheelTimeout);
      wheelTimeout = setTimeout(snapToNearest, 120);
    }, { passive: false });

    // Keyboard Arrow Keys support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        const next = Math.min(SONGS.length - 1, activeIndex + 1);
        if (next !== activeIndex) selectSong(next, isAudioPlaying);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        const prev = Math.max(0, activeIndex - 1);
        if (prev !== activeIndex) selectSong(prev, isAudioPlaying);
      } else if (e.key === ' ') {
        e.preventDefault();
        playBtn.click();
      }
    });

    // Direct Disc Click
    window.addEventListener('click', (e) => {
      if (hasDragged) return;
      if (e.target.closest('.nav') || e.target.closest('.audio-player-dock') || e.target.closest('.nav-dropdown')) return;
      const hit = getDiscIntersection(e.clientX, e.clientY);
      const hitIdx = hit ? hit.index : -1;
      if (hitIdx !== -1) {
        // Physical tactile spring bounce on whichever disc was clicked
        if (discMeshes[hitIdx]) {
          gsap.to(discMeshes[hitIdx].position, {
            z: (discMeshes[hitIdx].userData.basePosZ || 0) - 0.12,
            duration: 0.09,
            yoyo: true,
            repeat: 1,
            ease: 'power2.out'
          });
        }

        if (hitIdx === activeIndex) {
          playBtn.click();
        } else {
          selectSong(hitIdx, true);
        }
      }
    });

    // Responsive Resizing (Centered hero CD matching authentic A24 layout)
    function handleResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      if (window.innerWidth < 768) {
        galleryGroup.position.set(0, 0.08, 0);
        galleryGroup.scale.setScalar(0.85);
      } else if (window.innerWidth < 1024) {
        galleryGroup.position.set(0, 0.06, 0);
        galleryGroup.scale.setScalar(0.96);
      } else {
        galleryGroup.position.set(0, 0.04, 0);
        galleryGroup.scale.setScalar(1.08);
      }
    }
    window.addEventListener('resize', handleResize);
    handleResize();

    // Main Animation Render Loop
    function animate() {
      requestAnimationFrame(animate);

      // Smooth spring interpolation for subtle 3D hover tilt across discs
      discMeshes.forEach((mesh) => {
        const ud = mesh.userData;
        ud.hover += (ud.targetHover - ud.hover) * 0.12;
        ud.tiltX += (ud.targetTiltX - ud.tiltX) * 0.12;
        ud.tiltY += (ud.targetTiltY - ud.tiltY) * 0.12;

        mesh.rotation.x = (ud.baseRotX || 0) + ud.tiltX;
        mesh.rotation.y = (ud.baseRotY || 0) + ud.tiltY;
      });

      // Animate authentic A24 hover scribble
      updateScribbleAnimation(performance.now());

      // Spin active disc subtly when music is playing (around local spin group)
      if (isAudioPlaying && discMeshes[activeIndex]?.userData?.spinGroup) {
        discMeshes[activeIndex].userData.spinGroup.rotation.z += 0.005;
      }

      renderer.render(scene, camera);
    }

    // Initialize
    initCDs();
    animate();
  </script>
</body>
</html>
