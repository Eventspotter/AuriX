<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuriX — Audiophile CD Experience</title>

  <!-- External libraries -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- High-Fidelity Songs Data with Base64 Album Arts -->
  <script src="./songs-data.js"></script>

  <style>
    @font-face {
      font-family: 'NeueMontreal';
      src: url('./fonts/PPNeueMontreal-Medium.woff2') format('woff2');
      font-weight: 500;
    }
    @font-face {
      font-family: 'PPEiko';
      src: url('./fonts/PPEiko-Regular.woff2') format('woff2');
      font-weight: 400;
    }

    :root {
      --bg-color: #f7f7f6;
      --text-color: #111111;
      --border-color: rgba(0, 0, 0, 0.12);
      --font-serif: 'PPEiko', Georgia, 'Times New Roman', serif;
      --font-sans: 'NeueMontreal', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Film grain texture */
    .grain {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 50;
    }

    /* ========================================================
       TOP NAVIGATION BAR
       ======================================================== */
    .nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 48px;
      z-index: 40;
      pointer-events: none;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-color);
      pointer-events: auto;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
      pointer-events: auto;
    }

    .nav-item {
      position: relative;
    }

    .nav-link {
      font-size: 0.95rem;
      color: var(--text-color);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      position: relative;
      transition: opacity 0.2s ease;
    }

    .nav-link:hover {
      opacity: 0.65;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--text-color);
      border-radius: 50%;
    }

    .nav-chevron {
      width: 10px;
      height: 6px;
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .nav-link[data-dropdown-toggle="open"] .nav-chevron {
      transform: rotate(180deg);
    }

    /* Index Dropdown Roster */
    .nav-dropdown {
      position: absolute;
      top: calc(100% + 14px);
      right: 0;
      width: 280px;
      background: rgba(247, 247, 246, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 0;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 100;
      max-height: 380px;
      overflow-y: auto;
    }

    .nav-dropdown.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      font-size: 0.88rem;
      color: var(--text-color);
      text-decoration: none;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .dropdown-item.active {
      font-weight: 600;
      background: rgba(0, 0, 0, 0.07);
    }

    .dropdown-year {
      font-size: 0.75rem;
      opacity: 0.5;
      font-family: var(--font-serif);
    }

    /* ========================================================
       TOP LEFT METADATA PANEL (1:1 with Reference Screenshot)
       Completely safe from any CD overlap
       ======================================================== */
    .hero-info-panel {
      position: absolute;
      top: 56px;
      left: 64px;
      width: 360px;
      max-width: calc(100vw - 128px);
      z-index: 30;
      pointer-events: none;
    }

    .song-heading {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 4.2vw, 3.8rem);
      font-weight: 400;
      line-height: 0.96;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: 28px;
      word-break: break-word;
      hyphens: auto;
    }

    .metadata-table {
      width: 100%;
      border-top: 1px solid var(--border-color);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .meta-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.55;
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.95rem;
      text-align: right;
      letter-spacing: 0.01em;
      font-family: var(--font-serif);
    }

    /* ========================================================
       BOTTOM REVIEWS SECTION (Positioned under Active CD)
       ======================================================== */
    .reviews-container {
      position: absolute;
      bottom: 42px;
      left: 58%;
      transform: translateX(-50%);
      display: flex;
      gap: 64px;
      z-index: 25;
      pointer-events: none;
      text-align: center;
    }

    .review-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 250px;
    }

    .review-stars {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      color: #000;
      font-size: 0.82rem;
    }

    .review-pub {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.6;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .review-quote {
      font-family: var(--font-serif);
      font-size: 1.12rem;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    /* ========================================================
       FLOATING AUDIO PLAYER CONTROLS (Lower-Left Corner)
       ======================================================== */
    .audio-player-dock {
      position: absolute;
      bottom: 40px;
      left: 64px;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 18px 8px 10px;
      border-radius: 40px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
    }

    .play-trigger {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1), background 0.25s;
    }
    .play-trigger:hover {
      transform: scale(1.08);
      background: #e63946;
    }
    .play-trigger svg {
      width: 16px;
      height: 16px;
      margin-left: 2px;
    }
    .play-trigger.is-playing svg {
      margin-left: 0;
    }

    .player-track-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 140px;
    }
    .player-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .player-progress-fill {
      width: 0%;
      height: 100%;
      background: #111;
      border-radius: 2px;
    }
    .player-time {
      font-size: 0.65rem;
      opacity: 0.6;
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: space-between;
    }

    /* 3D WebGL Canvas Layer */
    #webgl-canvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="grain"></div>

  <!-- Navigation Bar (1:1 Placement) -->
  <header class="nav">
    <div class="nav-container">
      <a href="/" class="nav-logo" aria-label="AuriX">AuriX</a>
      <ul class="nav-links">
        <li class="nav-item">
          <a href="#" class="nav-link active">Songs</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">Artists</a>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="dropdown-toggle" data-dropdown-toggle="closed">
            <span>Index</span>
            <svg class="nav-chevron" viewBox="0 0 10 6" fill="none">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

          </button>

  <!-- Top-Left Information Table (1:1 with Screenshot) -->
  <div class="hero-info-panel">

    <div class="metadata-table">
      <div class="meta-row">
        <span class="meta-label">ARTIST</span>

      </div>

  <!-- Bottom Review Quotes (Positioned Underneath Active Disc) -->
  <div class="reviews-container">
    <div class="review-col">
      <div class="review-stars">★★★★★</div>
      <div class="review-pub" id="rev1-pub">TIMES AUDIO</div>

    </div>
    <div class="review-col">
      <div class="review-stars">★★★★★</div>
      <div class="review-pub" id="rev2-pub">INDIE SOUNDS</div>
      <div class="review-quote" id="rev2-quote">“VOCAL HARMONY ELEVATED TO PURE POETRY”</div>
    </div>
  </div>

  <!-- Audio Player Dock -->
  <div class="audio-player-dock">
    <button class="play-trigger" id="audio-play-btn" title="Play Song">
      <svg id="play-svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <div class="player-track-info">
      <div class="player-progress-bar" id="audio-progress-bar">
        <div class="player-progress-fill" id="audio-progress-fill"></div>
      </div>
      <div class="player-time">
        <span id="audio-time-current">0:00</span>
        <span id="audio-time-total">0:00</span>
      </div>
    </div>
  </div>

  <!-- Three.js 3D Viewport -->
  <div id="webgl-canvas"></div>

  <!-- Hidden HTML5 Audio Element -->
  <audio id="real-audio-player" preload="metadata"></audio>

  <script>
    gsap.registerPlugin(CustomEase);
    CustomEase.create("aurixGlide", "0.32, 0.72, 0, 1");

    // Retrieve songs array from songs-data.js
    const SONGS = window.AURIX_SONGS || [];

    /* ========================================================
       INDEX DROPDOWN ROSTER
       ======================================================== */
    const dropdownToggle = document.getElementById('dropdown-toggle');
    const dropdownRoster = document.getElementById('dropdown-roster');
    const dropdownItemsContainer = document.getElementById('dropdown-items');

    SONGS.forEach((song, idx) => {
      const a = document.createElement('a');
      a.href = '#';
      a.className = `dropdown-item ${idx === 0 ? 'active' : ''}`;
      a.innerHTML = `
        <span class="dropdown-title">${song.title}</span>
        <span class="dropdown-year">${song.year}</span>
      `;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        selectSong(idx);
        closeDropdown();
      });
      dropdownItemsContainer.appendChild(a);
    });

    let isDropdownOpen = false;
    function openDropdown() {
      isDropdownOpen = true;
      dropdownToggle.setAttribute('data-dropdown-toggle', 'open');
      dropdownRoster.classList.add('is-open');
    }
    function closeDropdown() {
      isDropdownOpen = false;
      dropdownToggle.setAttribute('data-dropdown-toggle', 'closed');
      dropdownRoster.classList.remove('is-open');
    }
    dropdownToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      isDropdownOpen ? closeDropdown() : openDropdown();
    });
    document.addEventListener('click', (e) => {
      if (!dropdownRoster.contains(e.target) && !dropdownToggle.contains(e.target)) {
        closeDropdown();
      }
    });

    /* ========================================================
       REAL AUDIO PLAYER LOGIC
       ======================================================== */
    const audio = document.getElementById('real-audio-player');
    const playBtn = document.getElementById('audio-play-btn');
    const playSvg = document.getElementById('play-svg');
    const progressBar = document.getElementById('audio-progress-bar');
    const progressFill = document.getElementById('audio-progress-fill');
    const timeCurrent = document.getElementById('audio-time-current');
    const timeTotal = document.getElementById('audio-time-total');

    let isAudioPlaying = false;

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function loadAudioTrack(idx, autoPlay = false) {
      const song = SONGS[idx];
      audio.src = song.audioSrc;
      audio.load();
      if (autoPlay) {
        audio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
      } else {
        setPlayState(false);
      }
    }

    function setPlayState(playing) {
      isAudioPlaying = playing;
      playBtn.classList.toggle('is-playing', playing);
      playSvg.innerHTML = playing
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' // Pause icon
        : '<path d="M8 5v14l11-7z"/>';                  // Play icon
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => setPlayState(true)).catch(console.error);
      } else {
        audio.pause();
        setPlayState(false);
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${progress}%`;
      timeCurrent.textContent = formatTime(audio.currentTime);
      timeTotal.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      selectSong((activeIndex + 1) % SONGS.length, true);
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    /* ========================================================
       INDIVIDUAL CD CANVAS TEXTURE GENERATOR (1024x1024)
       Every single CD gets its own dedicated canvas rendering
       its true extracted album cover artwork and vinyl sheen.
       ======================================================== */
    function createCDTextureForSong(song) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        const center = 512;
        const outerR = 496;
        const hubR = 175;
        const holeR = 76;

        const img = new Image();
        img.onload = () => {
          renderCanvas();
        };
        img.onerror = () => {
          renderCanvas();
        };

        function renderCanvas() {
          ctx.clearRect(0, 0, 1024, 1024);

          // 1. Circular disc clip
          ctx.save();
          ctx.beginPath();
          ctx.arc(center, center, outerR, 0, Math.PI * 2);
          ctx.clip();

          // 2. Base Disc background color
          ctx.fillStyle = song.bgColor || "#141418";
          ctx.fillRect(0, 0, 1024, 1024);

          // 3. FULL HIGH-RESOLUTION ALBUM ARTWORK
          if (img.complete && img.naturalWidth > 0) {
            ctx.save();
            ctx.globalAlpha = 0.95;
            const scale = Math.max(1024 / img.naturalWidth, 1024 / img.naturalHeight);
            const w = img.naturalWidth * scale;
            const h = img.naturalHeight * scale;
            ctx.drawImage(img, (1024 - w) / 2, (1024 - h) / 2, w, h);
            ctx.restore();

            // Contrast vignette
            const vignette = ctx.createRadialGradient(center, center, hubR + 10, center, center, outerR);
            vignette.addColorStop(0, "rgba(0,0,0,0.1)");
            vignette.addColorStop(0.7, "rgba(0,0,0,0.3)");
            vignette.addColorStop(1, "rgba(0,0,0,0.7)");
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, 1024, 1024);
          }

          // 4. Concentric Disc Grooves & Subtle Iridescent Sheen
          ctx.save();
          for (let r = hubR + 8; r < outerR - 6; r += 5) {
            ctx.lineWidth = 1;
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.035 + Math.sin(r * 0.45) * 0.025})`;
            ctx.beginPath();
            ctx.arc(center, center, r, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();

          // 5. Stylized Stamp on Disc Face (Clean & Non-cluttered)
          ctx.save();
          ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
          ctx.shadowBlur = 12;

          // If fallback (no image), render title and artist
          if (!img.complete || img.naturalWidth === 0) {
            ctx.fillStyle = song.textColor || "#ffffff";
            ctx.font = "bold 56px 'PPEiko', Georgia, serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const words = song.title.split(' ');
            if (words.length > 2) {
              const mid = Math.ceil(words.length / 2);
              ctx.fillText(words.slice(0, mid).join(' '), center, center - 60);
              ctx.fillText(words.slice(mid).join(' '), center, center + 45);
            } else {
              ctx.fillText(song.title, center, center - 40);
            }

            // Artist name
            ctx.font = "600 22px 'NeueMontreal', sans-serif";
            ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
            ctx.fillText(song.artist.toUpperCase(), center, center + 120);
          }

          // AuriX Brand stamp
          ctx.font = "bold 28px 'PPEiko', serif";
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.fillText("AuriX", center, 855);
          ctx.restore();

          // 6. Circular Rim Text
          ctx.save();
          ctx.font = "600 12px 'NeueMontreal', sans-serif";
          ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
          ctx.textAlign = "center";
          const rimText = `AuriX MASTER CD • ${song.artist.toUpperCase()} • ${song.album.toUpperCase()} • STEREO • LOSSLESS 24-BIT`;
          drawCurvedText(ctx, rimText, center, center, outerR - 22, -Math.PI * 0.85);
          ctx.restore();

          // 7. Frosted Center Polycarbonate Clamping Hub
          ctx.save();
          const hubGrad = ctx.createRadialGradient(center, center, holeR + 4, center, center, hubR);
          hubGrad.addColorStop(0, "rgba(235, 240, 250, 0.92)");
          hubGrad.addColorStop(0.35, "rgba(210, 220, 235, 0.72)");
          hubGrad.addColorStop(0.85, "rgba(190, 200, 220, 0.45)");
          hubGrad.addColorStop(1, "rgba(255, 255, 255, 0.15)");
          ctx.fillStyle = hubGrad;
          ctx.beginPath();
          ctx.arc(center, center, hubR, 0, Math.PI * 2);
          ctx.fill();

          // Inner Matrix Ring
          ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(center, center, hubR * 0.74, 0, Math.PI * 2);
          ctx.stroke();

          // Clear Spindle Hole Cutout
          ctx.globalCompositeOperation = "destination-out";
          ctx.beginPath();
          ctx.arc(center, center, holeR, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = "source-over";

          ctx.restore();
          ctx.restore(); // end clip

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.needsUpdate = true;
          resolve(texture);
        }

        // Trigger load via base64 data URL
        img.src = song.artDataUrl;
      });
    }

    function drawCurvedText(ctx, text, x, y, radius, startAngle) {
      const step = 0.038;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const angle = startAngle + i * step;
        ctx.save();
        ctx.translate(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius);
        ctx.rotate(angle + Math.PI / 2);
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }
    }

    /* ========================================================
       3D THREE.JS OPTICAL DISC ARC ENGINE (Reverse Engineered)
       Exact parameters: galleryRotX: -26, galleryRotY: -28,
       cameraDistance: 4.4, cameraFOV: 40, galleryScale: 1.05.
       Active CD center at x ~ 0.65, y ~ 0.12 (Zero overlap with HUD!)
       ======================================================== */
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 4.4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff9e8, 2.8);
    keyLight.position.set(3.5, 6, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x499ff5, 1.2);
    fillLight.position.set(-4, -2, 4);
    scene.add(fillLight);

    const bottomGlint = new THREE.DirectionalLight(0xffffff, 1.4);
    bottomGlint.position.set(0, -4, 2);
    scene.add(bottomGlint);

    // Standardized Disc Dimensions: Outer R = 1.0, Hub R = 0.28, Hole R = 0.14
    const DISC_OUTER_R = 1.0;
    const DISC_HUB_R = 0.28;
    const DISC_HOLE_R = 0.14;

    function remapRingUVs(geom) {
      const pos = geom.attributes.position;
      const uvs = geom.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const u = (pos.getX(i) / DISC_OUTER_R) * 0.5 + 0.5;
        const v = (pos.getY(i) / DISC_OUTER_R) * 0.5 + 0.5;
        uvs.setXY(i, u, v);
      }
      uvs.needsUpdate = true;
    }

    const frontRingGeom = new THREE.RingGeometry(DISC_HOLE_R, DISC_OUTER_R, 180, 1);
    remapRingUVs(frontRingGeom);

    const backRingGeom = new THREE.RingGeometry(DISC_HOLE_R, DISC_OUTER_R, 180, 1);
    remapRingUVs(backRingGeom);

    const hubGeom = new THREE.RingGeometry(DISC_HOLE_R, DISC_HUB_R, 120, 1);

    // Outer Rim Bevel
    const rimShape = new THREE.Shape();
    rimShape.absarc(0, 0, DISC_OUTER_R, 0, Math.PI * 2, false);
    const rimHole = new THREE.Path();
    rimHole.absarc(0, 0, DISC_OUTER_R - 0.012, 0, Math.PI * 2, true);
    rimShape.holes.push(rimHole);
    const rimGeom = new THREE.ExtrudeGeometry(rimShape, { depth: 0.02, bevelEnabled: false });
    rimGeom.center();

    // Materials
    const backIridescentMat = new THREE.MeshPhysicalMaterial({
      color: 0xe0e5ee,
      metalness: 0.95,
      roughness: 0.12,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      iridescence: 1.0,
      iridescenceIOR: 1.86,
      iridescenceThicknessRange: [150, 480],
      side: THREE.DoubleSide
    });

    const hubMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: 0.92,
      transparent: true,
      roughness: 0.1,
      ior: 1.54,
      thickness: 0.25,
      clearcoat: 1.0,
      side: THREE.DoubleSide
    });

    const rimMat = new THREE.MeshPhysicalMaterial({
      color: 0xcccccc,
      metalness: 0.7,
      roughness: 0.2,
      clearcoat: 1.0,
      side: THREE.DoubleSide
    });

    // Gallery Root Group (Rotated & Shifted to right of screen)
    const galleryGroup = new THREE.Group();
    galleryGroup.rotation.x = THREE.MathUtils.degToRad(-24);
    galleryGroup.rotation.y = THREE.MathUtils.degToRad(-26);
    galleryGroup.position.set(1.05, 0.42, 0);
    galleryGroup.scale.setScalar(0.98);
    scene.add(galleryGroup);

    const discMeshes = [];
    let activeIndex = 0;
    let carouselOffset = 0;
    let targetCarouselOffset = 0;

    // Load textures and assemble 3D CDs
    async function initCDs() {
      for (let i = 0; i < SONGS.length; i++) {
        const song = SONGS[i];
        const cdMeshGroup = new THREE.Group();

        // 1. Front printed label with unique cover art
        const tex = await createCDTextureForSong(song);
        const frontMat = new THREE.MeshPhysicalMaterial({
          map: tex,
          roughness: 0.22,
          metalness: 0.10,
          clearcoat: 0.95,
          clearcoatRoughness: 0.04,
          reflectivity: 0.95,
          side: THREE.FrontSide
        });
        const frontMesh = new THREE.Mesh(frontRingGeom, frontMat);
        frontMesh.position.z = 0.012;
        cdMeshGroup.add(frontMesh);

        // 2. Back silver optical data surface
        const backMesh = new THREE.Mesh(backRingGeom, backIridescentMat);
        backMesh.position.z = -0.012;
        backMesh.rotation.y = Math.PI;
        cdMeshGroup.add(backMesh);

        // 3. Center Hub
        const hubMesh = new THREE.Mesh(hubGeom, hubMat);
        cdMeshGroup.add(hubMesh);

        // 4. Rim
        const rimMesh = new THREE.Mesh(rimGeom, rimMat);
        cdMeshGroup.add(rimMesh);

        cdMeshGroup.userData = { index: i, song: song };
        galleryGroup.add(cdMeshGroup);
        discMeshes.push(cdMeshGroup);
      }

      updateDiscArc();
      loadAudioTrack(0, false);
    }

    /* ========================================================
       DISC ARC TRAJECTORY & PROPER SPACING
       Calculates smooth swoop across the 3D space
       ======================================================== */
    function updateDiscArc() {
      const N = discMeshes.length;

      discMeshes.forEach((mesh, i) => {
        let delta = i - carouselOffset;
        while (delta < -N / 2) delta += N;
        while (delta > N / 2) delta -= N;

        const absDelta = Math.abs(delta);
        const isActive = absDelta < 0.35;

        // Mathematical arc formula derived from A24:
        // theta is the angle along the curved ribbon
        const theta = delta * 0.38;
        const x = Math.sin(theta) * 2.3 * 2.4;
        const y = (isActive ? 0.06 : 0) - absDelta * 0.12;
        const z = -Math.cos(theta) * 2.4 + 2.4 - absDelta * 0.45;

        mesh.position.set(x, y, z);

        // Scale: active disc is 1.05, neighbor discs smoothly scaled down to 0.78
        const s = Math.max(0.68, 1.05 - absDelta * 0.18);
        mesh.scale.set(s, s, s);

        // Turn disc face towards the camera view
        mesh.rotation.y = -theta * 0.95;
        mesh.rotation.x = -delta * 0.06;
        if (!isAudioPlaying || i !== activeIndex) {
          mesh.rotation.z = -delta * 0.08;
        }

        // Hide discs that are completely behind or offscreen
        mesh.visible = absDelta < 3.2;
      });
    }

    function selectSong(idx, playImmediately = true) {
      activeIndex = idx;
      targetCarouselOffset = idx;

      // Update Top-Left HUD with GSAP
      const song = SONGS[idx];
      gsap.to('#song-title, #song-artist, #song-year, #song-album, #rev1-pub, #rev1-quote, #rev2-pub, #rev2-quote', {
        opacity: 0,
        y: -6,
        duration: 0.18,
        onComplete: () => {
          document.getElementById('song-title').textContent = song.title;
          document.getElementById('song-artist').textContent = song.artist;
          document.getElementById('song-year').textContent = song.year;
          document.getElementById('song-album').textContent = song.album;

          document.getElementById('rev1-pub').textContent = song.reviews[0].pub;
          document.getElementById('rev1-quote').textContent = `“${song.reviews[0].quote}”`;
          document.getElementById('rev2-pub').textContent = song.reviews[1].pub;
          document.getElementById('rev2-quote').textContent = `“${song.reviews[1].quote}”`;

          gsap.to('#song-title, #song-artist, #song-year, #song-album, #rev1-pub, #rev1-quote, #rev2-pub, #rev2-quote', {
            opacity: 1,
            y: 0,
            duration: 0.45,
            stagger: 0.02,
            ease: "aurixGlide"
          });
        }
      });

      // Update Dropdown Active state
      Array.from(dropdownItemsContainer.children).forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      // Smooth glide carousel
      gsap.to({ val: carouselOffset }, {
        val: targetCarouselOffset,
        duration: 0.95,
        ease: "aurixGlide",
        onUpdate: function() {
          carouselOffset = this.targets()[0].val;
          updateDiscArc();
        }
      });

      // Load & Play Audio
      loadAudioTrack(idx, playImmediately);
    }

    function snapToNearest() {
      const nearestIdx = Math.round(targetCarouselOffset);
      const normalized = ((nearestIdx % SONGS.length) + SONGS.length) % SONGS.length;

      gsap.to({ val: targetCarouselOffset }, {
        val: nearestIdx,
        duration: 0.85,
        ease: "aurixGlide",
        onUpdate: function() {
          carouselOffset = this.targets()[0].val;
          updateDiscArc();
        },
        onComplete: () => {
          if (normalized !== activeIndex) {
            selectSong(normalized, isAudioPlaying);
          }
        }
      });
    }

    /* ========================================================
       INTUITIVE USER INTERACTIONS (Drag, Scroll, Click, Keys)
       ======================================================== */
    let isDragging = false;
    let startX = 0;
    let prevOffset = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.nav') || e.target.closest('.audio-player-dock')) return;
      isDragging = true;
      startX = e.clientX;
      prevOffset = targetCarouselOffset;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = (e.clientX - startX) / (window.innerWidth * 0.45);
      targetCarouselOffset = prevOffset - dx;
      carouselOffset = targetCarouselOffset;
      updateDiscArc();
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;
      snapToNearest();
    });

    // Wheel Scroll support
    let wheelTimeout;
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.nav-dropdown')) return;
      e.preventDefault();
      targetCarouselOffset += Math.sign(e.deltaY || e.deltaX) * 0.35;
      carouselOffset = targetCarouselOffset;
      updateDiscArc();

      clearTimeout(wheelTimeout);
      wheelTimeout = setTimeout(snapToNearest, 120);
    }, { passive: false });

    // Keyboard Arrow Keys support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        selectSong((activeIndex + 1) % SONGS.length, isAudioPlaying);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        selectSong((activeIndex - 1 + SONGS.length) % SONGS.length, isAudioPlaying);
      } else if (e.key === ' ') {
        e.preventDefault();
        playBtn.click();
      }
    });

    // Direct Disc Click Raycasting
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      if (e.target.closest('.nav') || e.target.closest('.audio-player-dock')) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(galleryGroup.children, true);
      if (intersects.length > 0) {
        let parent = intersects[0].object.parent;
        while (parent && parent !== galleryGroup) {
          if (parent.userData && parent.userData.index !== undefined) {
            selectSong(parent.userData.index, true);
            break;
          }
          parent = parent.parent;
        }
      }
    });

    // Responsive Resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Adjust group position slightly on narrower screens
      if (window.innerWidth < 1024) {
        galleryGroup.position.x = 0.35;
        galleryGroup.scale.setScalar(0.9);
      } else {
        galleryGroup.position.x = 0.65;
        galleryGroup.scale.setScalar(1.05);
      }
    });

    // Main Animation Render Loop
    function animate() {
      requestAnimationFrame(animate);

      // Spin active disc subtly when music is playing
      if (isAudioPlaying && discMeshes[activeIndex]) {
        discMeshes[activeIndex].rotation.z += 0.005;
      }

      renderer.render(scene, camera);
    }

    // Initialize
    initCDs();
    animate();
  </script>
</body>
</html>
