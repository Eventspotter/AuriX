<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <style>
    @font-face {
      font-family: 'NeueMontreal';
      src: url('./fonts/PPNeueMontreal-Medium.woff2') format('woff2');
      font-weight: 500;
    }
    @font-face {
      font-family: 'PPEiko';
      src: url('./fonts/PPEiko-Regular.woff2') format('woff2');
      font-weight: 400;
    }

    :root {
      --bg-color: #f7f7f6;
      --text-color: #111111;
      --border-color: rgba(0, 0, 0, 0.14);
      --font-serif: 'PPEiko', Georgia, 'Times New Roman', serif;
      --font-sans: 'NeueMontreal', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Fine paper texture / grain overlay */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.035;
      background-image: url('./images/noise_1noise.avif');
      background-repeat: repeat;
    }

    /* ========================================================
       TOP NAVIGATION BAR (1:1 with Screenshot)
       ======================================================== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: auto;
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-color);
      text-decoration: none;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
      position: relative;
    }

    .nav-item {
      position: relative;
    }

    .nav-link {
      background: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: var(--text-color);
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      position: relative;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-color);
    }

    .nav-chevron {
      width: 10px;
      height: 6px;
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }
    [data-dropdown-toggle="open"] .nav-chevron {
      transform: rotate(180deg);
    }

    /* Index Dropdown Roster */
    .nav-dropdown {
      position: absolute;
      top: calc(100% + 12px);
      right: -24px;
      width: 340px;
      max-height: 420px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.12);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.98);
      transform-origin: top right;
      transition: all 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      overflow: hidden;
      display: flex;
      z-index: 110;
    }

    .nav-dropdown.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .dropdown-content {
      flex: 1;
      max-height: 420px;
      overflow-y: auto;
      padding: 8px 0;
      scrollbar-width: none;
    }
    .dropdown-content::-webkit-scrollbar {
      display: none;
    }

    .dropdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 22px;
      color: rgba(0, 0, 0, 0.7);
      text-decoration: none;
      transition: background 0.2s, color 0.2s, padding-left 0.2s;
    }
    .dropdown-item:hover, .dropdown-item.active {
      background: rgba(0, 0, 0, 0.04);
      color: #000;
      padding-left: 26px;
    }

    .dropdown-title {
      font-family: var(--font-serif);
      font-size: 1.05rem;
    }
    .dropdown-year {
      font-size: 0.75rem;
      opacity: 0.5;
      font-family: var(--font-sans);
    }

    /* ========================================================
       TOP LEFT METADATA PANEL (1:1 with Screenshot)
       ======================================================== */
    .hero-info-panel {
      position: absolute;
      top: 52px;
      left: 64px;
      z-index: 20;
      max-width: 440px;
      pointer-events: none;
    }

    .song-heading {
      font-family: var(--font-serif);
      font-size: clamp(2.6rem, 4.2vw, 3.8rem);
      font-weight: 400;
      line-height: 1.02;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin-bottom: 28px;
    }

    .metadata-table {
      width: 100%;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .meta-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.55;
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.95rem;
      text-align: right;
      letter-spacing: 0.01em;
      font-family: var(--font-serif);
    }

    /* ========================================================
       BOTTOM REVIEWS SECTION (1:1 with Screenshot)
       ======================================================== */
    .reviews-container {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 72px;
      z-index: 20;
      pointer-events: none;
      text-align: center;
    }

    .review-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 250px;
    }

    .review-stars {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      color: #000;
      font-size: 0.85rem;
    }

    .review-pub {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.6;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .review-quote {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    /* ========================================================
       FLOATING AUDIO PLAYER CONTROLS
       ======================================================== */
    .audio-player-dock {
      position: absolute;
      bottom: 40px;
      left: 64px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 16px 8px 10px;
      border-radius: 40px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
    }

    .play-trigger {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1), background 0.25s;
    }
    .play-trigger:hover {
      transform: scale(1.08);
      background: #ff4d30;
    }
    .play-trigger svg {
      width: 16px;
      height: 16px;
      margin-left: 2px;
    }
    .play-trigger.is-playing svg {
      margin-left: 0;
    }

    .player-track-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 140px;
    }
    .player-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .player-progress-fill {
      width: 0%;
      height: 100%;
      background: #111;
      border-radius: 2px;
    }
    .player-time {
      font-size: 0.65rem;
      opacity: 0.6;
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: space-between;
    }

    /* 3D WebGL Canvas Layer */
    #webgl-canvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Sub-canvas for rendering 2D CD textures */
    #texture-canvas-cache {
      display: none;
    }
  </style>
</head>

        reviews: [

    /* ========================================================
       INDEX DROPDOWN LOGIC
       ======================================================== */
    const dropdownToggle = document.getElementById('dropdown-toggle');
    const dropdownRoster = document.getElementById('dropdown-roster');
    const dropdownItemsContainer = document.getElementById('dropdown-items');

    SONGS.forEach((song, idx) => {
      const a = document.createElement('a');
      a.href = '#';
      a.className = `dropdown-item ${idx === 0 ? 'active' : ''}`;
      a.innerHTML = `
        <span class="dropdown-title">${song.title}</span>
        <span class="dropdown-year">${song.year}</span>
      `;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        selectSong(idx);
        closeDropdown();
      });
      dropdownItemsContainer.appendChild(a);
    });

    let isDropdownOpen = false;
    function openDropdown() {
      isDropdownOpen = true;
      dropdownToggle.setAttribute('data-dropdown-toggle', 'open');
      dropdownRoster.classList.add('is-open');
    }
    function closeDropdown() {
      isDropdownOpen = false;
      dropdownToggle.setAttribute('data-dropdown-toggle', 'closed');
      dropdownRoster.classList.remove('is-open');
    }
    dropdownToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      isDropdownOpen ? closeDropdown() : openDropdown();
    });
    document.addEventListener('click', (e) => {
      if (!dropdownRoster.contains(e.target) && !dropdownToggle.contains(e.target)) {
        closeDropdown();
      }
    });

    /* ========================================================
       REAL AUDIO PLAYER LOGIC
       ======================================================== */
    const audio = document.getElementById('real-audio-player');
    const playBtn = document.getElementById('audio-play-btn');
    const playSvg = document.getElementById('play-svg');
    const progressBar = document.getElementById('audio-progress-bar');
    const progressFill = document.getElementById('audio-progress-fill');
    const timeCurrent = document.getElementById('audio-time-current');
    const timeTotal = document.getElementById('audio-time-total');

    let isAudioPlaying = false;

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function loadAudioTrack(idx, autoPlay = false) {
      const song = SONGS[idx];
      audio.src = song.audioSrc;
      audio.load();
      if (autoPlay) {
        audio.play().then(() => {
          setPlayState(true);
        }).catch(() => setPlayState(false));
      } else {
        setPlayState(false);
      }
    }

    function setPlayState(playing) {
      isAudioPlaying = playing;
      playBtn.classList.toggle('is-playing', playing);
      playSvg.innerHTML = playing
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' // Pause
        : '<path d="M8 5v14l11-7z"/>';                  // Play
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => setPlayState(true)).catch(console.error);
      } else {
        audio.pause();
        setPlayState(false);
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${progress}%`;
      timeCurrent.textContent = formatTime(audio.currentTime);
      timeTotal.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      // Auto next song!
      selectSong((activeIndex + 1) % SONGS.length, true);
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    /* ========================================================
       2D PROCEDURAL CD TEXTURE GENERATION (1024x1024)
       Draws authentic CD face artwork matching screenshot style
       ======================================================== */
    const offscreenCanvas = document.getElementById('texture-canvas-cache');
    const offCtx = offscreenCanvas.getContext('2d');

    function generateCDTexture(song) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = song.artSrc;

        img.onload = () => {
          renderCanvasCD(img, song);
          const tex = new THREE.CanvasTexture(offscreenCanvas);
          tex.colorSpace = THREE.SRGBColorSpace;
          resolve(tex);
        };
        img.onerror = () => {
          renderCanvasCD(null, song);
          const tex = new THREE.CanvasTexture(offscreenCanvas);
          tex.colorSpace = THREE.SRGBColorSpace;
          resolve(tex);
        };
      });
    }

    function renderCanvasCD(img, song) {
      const S = 1024;
      const center = S / 2;
      offCtx.clearRect(0, 0, S, S);

      // 1. Circular Outer Disc Mask
      offCtx.save();
      offCtx.beginPath();
      offCtx.arc(center, center, S * 0.49, 0, Math.PI * 2);
      offCtx.clip();

      // 2. Base Dark/Theme Disc Color
      offCtx.fillStyle = song.bgColor;
      offCtx.fillRect(0, 0, S, S);

      // 3. Album Art compositing
      if (img) {
        offCtx.save();
        offCtx.globalAlpha = 0.88;
        // Cover scaled & centered
        const scale = Math.max(S / img.width, S / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        offCtx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
        offCtx.restore();

        // Dark gradient overlay for typography readability
        const radialDark = offCtx.createRadialGradient(center, center, 80, center, center, S * 0.49);
        radialDark.addColorStop(0, "rgba(0,0,0,0.2)");
        radialDark.addColorStop(0.7, "rgba(0,0,0,0.45)");
        radialDark.addColorStop(1, "rgba(0,0,0,0.85)");
        offCtx.fillStyle = radialDark;
        offCtx.fillRect(0, 0, S, S);
      }

      // 4. Concentric Disc Grooves / Optical Sheen Rings
      offCtx.lineWidth = 1;
      for (let r = S * 0.22; r < S * 0.485; r += 4) {
        const alpha = 0.04 + (Math.sin(r * 0.5) * 0.03);
        offCtx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        offCtx.beginPath();
        offCtx.arc(center, center, r, 0, Math.PI * 2);
        offCtx.stroke();
      }

      // 5. Bold Title across Disc (like screenshot)
      offCtx.save();
      offCtx.fillStyle = song.textColor;
      offCtx.font = "bold 78px 'PPEiko', Georgia, serif";
      offCtx.textAlign = "center";
      offCtx.textBaseline = "middle";
      offCtx.shadowColor = "rgba(0,0,0,0.85)";
      offCtx.shadowBlur = 12;

      // Split long title into 2 lines if needed
      const words = song.title.split(' ');
      if (words.length > 2) {
        const mid = Math.ceil(words.length / 2);
        offCtx.fillText(words.slice(0, mid).join(' '), center, center - 60);
        offCtx.fillText(words.slice(mid).join(' '), center, center + 40);
      } else {
        offCtx.fillText(song.title, center, center - 40);
      }
      offCtx.restore();

      // 6. Artist & AuriX Logo
      offCtx.save();
      offCtx.fillStyle = "rgba(255, 255, 255, 0.95)";
      offCtx.font = "500 24px 'NeueMontreal', sans-serif";
      offCtx.textAlign = "center";
      offCtx.letterSpacing = "4px";
      offCtx.fillText(song.artist.toUpperCase(), center, center + 120);

      // AuriX Brand stamp
      offCtx.font = "bold 32px 'PPEiko', serif";
      offCtx.fillStyle = "#ffffff";
      offCtx.fillText("AuriX", center, S * 0.84);
      offCtx.restore();

      // 7. Circular Rim Text
      offCtx.save();
      offCtx.font = "600 12px 'NeueMontreal', sans-serif";
      offCtx.fillStyle = "rgba(255, 255, 255, 0.5)";
      offCtx.textAlign = "center";
      const rimText = `AuriX MASTER CD • ${song.artist.toUpperCase()} • ${song.album.toUpperCase()} • COMPACT DISC DIGITAL AUDIO • STEREO • 2026`;
      drawCurvedText(offCtx, rimText, center, center, S * 0.46, -Math.PI * 0.85);
      offCtx.restore();

      // 8. Center Plastic Hub & Spindle Hole Cutout
      // Frosted inner hub band
      const hubGrad = offCtx.createRadialGradient(center, center, S * 0.08, center, center, S * 0.18);
      hubGrad.addColorStop(0, "rgba(220, 225, 235, 0.95)");
      hubGrad.addColorStop(0.5, "rgba(200, 205, 215, 0.7)");
      hubGrad.addColorStop(0.9, "rgba(180, 185, 195, 0.4)");
      hubGrad.addColorStop(1, "rgba(0, 0, 0, 0.15)");
      offCtx.fillStyle = hubGrad;
      offCtx.beginPath();
      offCtx.arc(center, center, S * 0.18, 0, Math.PI * 2);
      offCtx.fill();

      // Mirrored serial code ring
      offCtx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      offCtx.lineWidth = 1.5;
      offCtx.beginPath();
      offCtx.arc(center, center, S * 0.14, 0, Math.PI * 2);
      offCtx.stroke();

      // Transparent clear center spindle hole
      offCtx.globalCompositeOperation = "destination-out";
      offCtx.beginPath();
      offCtx.arc(center, center, S * 0.075, 0, Math.PI * 2);
      offCtx.fill();
      offCtx.globalCompositeOperation = "source-over";

      offCtx.restore();
    }

    function drawCurvedText(ctx, text, x, y, radius, startAngle) {
      const step = 0.038;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const angle = startAngle + i * step;
        ctx.save();
        ctx.translate(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius);
        ctx.rotate(angle + Math.PI / 2);
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }
    }

    /* ========================================================
       3D THREE.JS OPTICAL DISC ARC ENGINE (1:1 with Screenshot)
       ======================================================== */
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 7.8);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    // Studio Lighting matching screenshot specular glints
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.6);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
    keyLight.position.set(4, 6, 8);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xddeeff, 1.8);
    fillLight.position.set(-6, -3, 5);
    scene.add(fillLight);

    const bottomGlint = new THREE.DirectionalLight(0xffffff, 1.5);
    bottomGlint.position.set(0, -6, 2);
    scene.add(bottomGlint);

    // Disc Geometries: Outer R = 2.0, Hub R = 0.58, Hole R = 0.28
    const DISC_OUTER_R = 2.0;
    const DISC_HUB_R = 0.58;
    const DISC_HOLE_R = 0.28;

    function remapRingUVs(geom) {
      const pos = geom.attributes.position;
      const uvs = geom.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const u = (pos.getX(i) / DISC_OUTER_R) * 0.5 + 0.5;
        const v = (pos.getY(i) / DISC_OUTER_R) * 0.5 + 0.5;
        uvs.setXY(i, u, v);
      }
      uvs.needsUpdate = true;
    }

    const frontRingGeom = new THREE.RingGeometry(DISC_HOLE_R, DISC_OUTER_R, 180, 1);
    remapRingUVs(frontRingGeom);

    const backRingGeom = new THREE.RingGeometry(DISC_HOLE_R, DISC_OUTER_R, 180, 1);
    remapRingUVs(backRingGeom);

    // Center Transparent Hub
    const hubGeom = new THREE.RingGeometry(DISC_HOLE_R, DISC_HUB_R, 120, 1);

    // Rim Bevel (Outer Plastic/Silver Edge)
    const rimShape = new THREE.Shape();
    rimShape.absarc(0, 0, DISC_OUTER_R, 0, Math.PI * 2, false);
    const rimHole = new THREE.Path();
    rimHole.absarc(0, 0, DISC_OUTER_R - 0.02, 0, Math.PI * 2, true);
    rimShape.holes.push(rimHole);
    const rimGeom = new THREE.ExtrudeGeometry(rimShape, { depth: 0.035, bevelEnabled: false });
    rimGeom.center();

    // Materials
    const backIridescentMat = new THREE.MeshPhysicalMaterial({
      color: 0xe0e5ee,
      metalness: 0.94,
      roughness: 0.12,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      iridescence: 1.0,
      iridescenceIOR: 1.6,
      iridescenceThicknessRange: [120, 420],
      side: THREE.DoubleSide
    });

    const hubMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: 0.92,
      transparent: true,
      roughness: 0.08,
      ior: 1.52,
      thickness: 0.25,
      clearcoat: 1.0,
      side: THREE.DoubleSide
    });

    const rimMat = new THREE.MeshPhysicalMaterial({
      color: 0x999999,
      metalness: 0.7,
      roughness: 0.2,
      clearcoat: 1.0,
      side: THREE.DoubleSide
    });

    const discGroup = new THREE.Group();
    scene.add(discGroup);

    const discMeshes = [];
    let activeIndex = 0;
    let carouselOffset = 0;
    let targetCarouselOffset = 0;

    // Load textures and assemble 3D CDs
    async function initCDs() {
      for (let i = 0; i < SONGS.length; i++) {
        const song = SONGS[i];
        const cdMeshGroup = new THREE.Group();

        // 1. Front printed label
        const tex = await generateCDTexture(song);
        const frontMat = new THREE.MeshPhysicalMaterial({
          map: tex,
          roughness: 0.28,
          metalness: 0.15,
          clearcoat: 0.9,
          clearcoatRoughness: 0.06,
          reflectivity: 0.95,
          side: THREE.FrontSide
        });
        const frontMesh = new THREE.Mesh(frontRingGeom, frontMat);
        frontMesh.position.z = 0.018;
        cdMeshGroup.add(frontMesh);

        // 2. Back silver data surface
        const backMesh = new THREE.Mesh(backRingGeom, backIridescentMat);
        backMesh.position.z = -0.018;
        backMesh.rotation.y = Math.PI;
        cdMeshGroup.add(backMesh);

        // 3. Center Hub
        const hubMesh = new THREE.Mesh(hubGeom, hubMat);
        cdMeshGroup.add(hubMesh);

        // 4. Rim
        const rimMesh = new THREE.Mesh(rimGeom, rimMat);
        cdMeshGroup.add(rimMesh);

        cdMeshGroup.userData = { index: i, song: song };
        discGroup.add(cdMeshGroup);
        discMeshes.push(cdMeshGroup);
      }

      updateDiscArc();
      loadAudioTrack(0, false);
    }

    /* ========================================================
       DISC ARC TRAJECTORY (EXACT MATCH TO SCREENSHOT)
       Discs follow a sweeping curved arc from lower-left to upper-right
       ======================================================== */
    function updateDiscArc() {
      const N = discMeshes.length;

      discMeshes.forEach((mesh, i) => {
        // Calculate offset distance relative to active center disc
        let delta = i - carouselOffset;
        // Wrap delta around for infinite cycling
        while (delta < -N / 2) delta += N;
        while (delta > N / 2) delta -= N;

        const absDelta = Math.abs(delta);

        // Sweeping arc: x spreads horizontally, y rises towards right, z recedes
        // Left side: delta < 0 (lower left)
        // Center: delta = 0 (big, prominent in center)
        // Right side: delta > 0 (high up to right)
        const x = delta * 2.5 + 0.15;
        const y = delta * 0.48 - Math.pow(delta, 2) * 0.08;
        const z = -absDelta * 0.85 + 0.55;

        mesh.position.set(x, y, z);

        // Scale: active disc is largest (scale ~ 1.05), side discs scale down
        const s = Math.max(0.68, 1.08 - absDelta * 0.18);
        mesh.scale.set(s, s, s);

        // Rotations:
        // Center disc tilts slightly back (x ~ 0.15), side discs tilt dramatically
        const rotX = 0.14 - delta * 0.05;
        const rotY = -delta * 0.22;
        const rotZ = delta * 0.12;

        mesh.rotation.x = rotX;
        mesh.rotation.y = rotY;
        if (!isAudioPlaying || i !== activeIndex) {
          mesh.rotation.z = rotZ;
        }

        // Hide discs far behind to keep view clean
        mesh.visible = absDelta < 3.2;
      });
    }

    function selectSong(idx, playImmediately = true) {
      activeIndex = idx;
      targetCarouselOffset = idx;

      // Update Top-Left HUD
      const song = SONGS[idx];
      gsap.to('#song-title, #song-artist, #song-year, #song-album, #rev1-pub, #rev1-quote, #rev2-pub, #rev2-quote', {
        opacity: 0,
        y: -6,
        duration: 0.18,
        onComplete: () => {
          document.getElementById('song-title').textContent = song.title;
          document.getElementById('song-artist').textContent = song.artist;
          document.getElementById('song-year').textContent = song.year;
          document.getElementById('song-album').textContent = song.album;

          document.getElementById('rev1-pub').textContent = song.reviews[0].pub;
          document.getElementById('rev1-quote').textContent = song.reviews[0].quote;
          document.getElementById('rev2-pub').textContent = song.reviews[1].pub;
          document.getElementById('rev2-quote').textContent = song.reviews[1].quote;

          gsap.to('#song-title, #song-artist, #song-year, #song-album, #rev1-pub, #rev1-quote, #rev2-pub, #rev2-quote', {
            opacity: 1,
            y: 0,
            duration: 0.45,
            stagger: 0.02,
            ease: "aurixGlide"
          });
        }
      });

      // Update Dropdown Active state
      Array.from(dropdownItemsContainer.children).forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      // Smooth glide carousel
      gsap.to({ val: carouselOffset }, {
        val: targetCarouselOffset,
        duration: 0.95,
        ease: "aurixGlide",
        onUpdate: function() {
          carouselOffset = this.targets()[0].val;
          updateDiscArc();
        }
      });

      // Load & Play Audio
      loadAudioTrack(idx, playImmediately);
    }

    function snapToNearest() {
      const nearestIdx = Math.round(targetCarouselOffset);
      const normalized = ((nearestIdx % SONGS.length) + SONGS.length) % SONGS.length;

      gsap.to({ val: targetCarouselOffset }, {
        val: nearestIdx,
        duration: 0.85,
        ease: "aurixGlide",
        onUpdate: function() {
          targetCarouselOffset = this.targets()[0].val;
          carouselOffset = targetCarouselOffset;
          updateDiscArc();
        },
        onComplete: () => {
          if (normalized !== activeIndex) {
            selectSong(normalized, isAudioPlaying);
          }
        }
      });
    }

    // Interactive Dragging on 3D Canvas
    let isDragging = false;
    let startX = 0;
    let prevOffset = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.nav') || e.target.closest('.audio-player-dock')) return;
      isDragging = true;
      startX = e.clientX;
      prevOffset = targetCarouselOffset;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      targetCarouselOffset = prevOffset - (dx * 0.0035);
      carouselOffset = targetCarouselOffset;
      updateDiscArc();
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;
      snapToNearest();
    });

    // Wheel navigation
    window.addEventListener('wheel', (e) => {
      targetCarouselOffset += e.deltaY * 0.0018;
      carouselOffset = targetCarouselOffset;
      updateDiscArc();
      snapToNearest();
    }, { passive: true });

    // Click on active CD to Play / Pause
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      if (e.target.closest('.nav') || e.target.closest('.audio-player-dock')) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(discGroup.children, true);
      if (intersects.length > 0) {
        let rootMesh = intersects[0].object;
        while (rootMesh.parent && rootMesh.parent !== discGroup) {
          rootMesh = rootMesh.parent;
        }
        if (rootMesh.userData && rootMesh.userData.index !== undefined) {
          const clickedIdx = rootMesh.userData.index;
          if (clickedIdx === activeIndex) {
            // Toggle play
            if (audio.paused) {
              audio.play().then(() => setPlayState(true)).catch(console.error);
            } else {
              audio.pause();
              setPlayState(false);
            }
          } else {
            selectSong(clickedIdx, true);
          }
        }
      }
    });

    // Animation Render Loop
    function render() {
      requestAnimationFrame(render);

      // Smooth spin of front disc while music is playing!
      if (isAudioPlaying && discMeshes[activeIndex]) {
        discMeshes[activeIndex].children[0].rotation.z += 0.025; // front label spin
        discMeshes[activeIndex].children[1].rotation.z += 0.025; // back data spin
      }

      // Idle floating breath motion
      discGroup.position.y = Math.sin(Date.now() * 0.0015) * 0.04;

      renderer.render(scene, camera);
    }

    // Start Everything
    initCDs().then(() => {
      render();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
