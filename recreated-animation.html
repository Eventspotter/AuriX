<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A24 Recreated — Complete Smooth Scroll & Dropdown Experience</title>

  <!-- External CDNs matching the original tech stack -->

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <style>
    @font-face {
      font-family: 'NeueMontreal';
      src: url('./fonts/PPNeueMontreal-Medium.woff2') format('woff2');
      font-weight: 500;
    }
    @font-face {
      font-family: 'PPEiko';
      src: url('./fonts/PPEiko-Regular.woff2') format('woff2');
      font-weight: 400;
    }

    :root {
      --nav-dock-width: 320px;
      --nav-close-duration: 460ms;
      --nav-scroll-fade: 48px;
      --color-bg: #0d0d0d;
      --color-text: #f4f4f4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'NeueMontreal', -apple-system, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Film grain texture */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.04;
      background-image: url('./images/noise_1noise.avif');
      background-repeat: repeat;
    }

    /* Navigation Bar */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .nav-logo svg {
      width: 48px;
      height: auto;
      color: #fff;
      display: block;
    }

    .nav-center__list {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
      position: relative;
    }

    .nav-link {
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      padding: 6px 0;
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 1px;
      background: #fff;
      transition: width 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .nav-link:hover::after, .nav-link.active::after {
      width: 100%;
    }

    /* Dropdown Toggle SVG Arrow */
    .nav-link__dropdown-icon {
      width: 10px;
      height: 6px;
      transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
    }
    [data-dropdown-toggle="open"] .nav-link__dropdown-icon {
      transform: rotate(180deg);
    }

    /* Dropdown Overlay Container */
    .nav-dropdown {
      position: absolute;
      top: calc(100% + 12px);
      right: -20px;
      width: 380px;
      max-height: 440px;
      background: rgba(18, 18, 18, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px) scale(0.98);
      transform-origin: top right;
      transition: opacity 0.4s cubic-bezier(0.32, 0.72, 0, 1),
                  transform 0.4s cubic-bezier(0.32, 0.72, 0, 1),
                  visibility 0.4s;
      overflow: hidden;
      display: flex;
    }

    .nav-dropdown.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .nav-dropdown__content {
      flex: 1;
      max-height: 440px;
      overflow-y: auto;
      padding: 12px 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .nav-dropdown__content::-webkit-scrollbar {
      display: none;
    }

    .nav-dropdown__link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.25s, color 0.25s, transform 0.25s;
    }
    .nav-dropdown__link:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      transform: translateX(4px);
    }

    .nav-dropdown__link-label {
      font-family: 'PPEiko', serif;
      font-size: 1.05rem;
    }
    .nav-dropdown__year {
      font-family: inherit;
      font-size: 0.75rem;
      opacity: 0.4;
      letter-spacing: 0.08em;
    }

    /* Custom Custom Scrollbar Indicator */
    .nav-dropdown__scrollbar {
      width: 4px;
      background: rgba(255, 255, 255, 0.05);
      position: relative;
      margin: 8px 4px 8px 0;
      border-radius: 4px;
    }
    .nav-dropdown__scrollbar-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 20%;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      transition: background 0.2s;
    }

    /* Hero Section with 3D Disc Wheel */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #webgl-canvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Film Information HUD Overlay */
    .experience_info {
      position: absolute;
      top: 140px;
      left: 60px;
      z-index: 20;
      pointer-events: none;
      max-width: 460px;
    }

    .film-heading {
      font-family: 'PPEiko', serif;
      font-size: clamp(3rem, 6vw, 5.5rem);
      line-height: 0.95;
      font-weight: 400;
      margin-bottom: 32px;
      letter-spacing: -0.03em;
    }

    .info-content {
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .info-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      opacity: 0.45;
    }
    .info-val {
      font-size: 0.95rem;
      text-align: right;
    }

    /* Testimonial Quote HUD */
    .testimonial_wrap {
      position: absolute;
      top: 140px;
      right: 60px;
      z-index: 20;
      pointer-events: none;
      text-align: right;
      max-width: 360px;
    }
    .testimonial-stars {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      margin-bottom: 12px;
      color: #fff;
    }
    .testimonial-quote {
      font-family: 'PPEiko', serif;
      font-size: 1.45rem;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .testimonial-pub {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      opacity: 0.5;
    }

    /* Bottom HUD indicators */
    .hud-footer {
      position: absolute;
      bottom: 40px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      font-size: 0.8rem;
      opacity: 0.6;
    }

    /* Section 2: Smooth Parallax Scroll Catalogue */
    .catalogue-section {
      position: relative;
      background: #111;
      padding: 140px 60px;
      z-index: 30;
      min-height: 120vh;
    }

    .catalogue-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 80px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 24px;
    }

    .catalogue-title {
      font-family: 'PPEiko', serif;
      font-size: clamp(2.5rem, 4vw, 4rem);
      font-weight: normal;
    }

    .catalogue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 48px;
    }

    .catalogue-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(60px);
      transition: border-color 0.4s, background 0.4s;
    }
    .catalogue-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.04);
    }

    .card-media {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1c1c1c 0%, #0d0d0d 100%);
      padding: 30px;
      overflow: hidden;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.8));
      transition: transform 0.8s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .catalogue-card:hover .card-media img {
      transform: scale(1.08) rotate(12deg);
    }

    .card-body {
      padding: 24px;
    }
    .card-body h3 {
      font-family: 'PPEiko', serif;
      font-size: 1.5rem;
      margin-bottom: 6px;
    }
    .card-body p {
      font-size: 0.85rem;
      opacity: 0.5;
    }
  </style>
</head>

  <script>
    // Register GSAP plugins & Custom Ease
    gsap.registerPlugin(ScrollTrigger, CustomEase);
    CustomEase.create("discGlide", "0.32, 0.72, 0, 1");

    const lenis = new Lenis({
      lerp: 0.08,
      wheelMultiplier: 1.1,
      smoothWheel: true,

    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

    /* ========================================================
       1. DROPDOWN SEAMLESS ANIMATION & CUSTOM SCROLLBAR
       ======================================================== */
    const dropdownBtn = document.getElementById('dropdown-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const dropdownScrollList = document.getElementById('dropdown-scroll-list');
    const dropdownThumb = document.getElementById('dropdown-thumb');

    // Populate dropdown list
    FILMS.forEach((film, index) => {
      const item = document.createElement('a');
      item.href = '#';
      item.className = 'nav-dropdown__link';
      item.innerHTML = `
        <span class="nav-dropdown__link-label">${film.title}</span>
        <span class="nav-dropdown__year">${film.year}</span>
      `;
      item.addEventListener('click', (e) => {
        e.preventDefault();
        rotateToIndex(index);
        closeDropdown();
      });
      dropdownScrollList.appendChild(item);
    });

    let isDropdownOpen = false;

    function openDropdown() {
      isDropdownOpen = true;
      dropdownBtn.setAttribute('data-dropdown-toggle', 'open');
      dropdownMenu.classList.add('is-open');
      updateDropdownScrollbar();
    }

    function closeDropdown() {
      isDropdownOpen = false;
      dropdownBtn.setAttribute('data-dropdown-toggle', 'closed');
      dropdownMenu.classList.remove('is-open');
    }

    dropdownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isDropdownOpen ? closeDropdown() : openDropdown();
    });

    document.addEventListener('click', (e) => {
      if (!dropdownMenu.contains(e.target) && !dropdownBtn.contains(e.target)) {
        closeDropdown();
      }
    });

    // Custom smooth scrollbar progress inside dropdown
    function updateDropdownScrollbar() {
      const scrollHeight = dropdownScrollList.scrollHeight;
      const clientHeight = dropdownScrollList.clientHeight;
      const scrollTop = dropdownScrollList.scrollTop;
      const maxScroll = scrollHeight - clientHeight;

      if (maxScroll <= 0) {
        dropdownThumb.style.display = 'none';
        return;
      }
      dropdownThumb.style.display = 'block';

      const thumbHeight = Math.max(24, (clientHeight / scrollHeight) * clientHeight);
      dropdownThumb.style.height = `${thumbHeight}px`;

      const travel = clientHeight - thumbHeight;
      const progress = scrollTop / maxScroll;
      dropdownThumb.style.transform = `translateY(${progress * travel}px)`;
    }

    dropdownScrollList.addEventListener('scroll', updateDropdownScrollbar, { passive: true });

    /* ========================================================
       2. THREE.JS 3D OPTICAL DISC WHEEL GALLERY
       ======================================================== */
    const canvasContainer = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 7.2);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    canvasContainer.appendChild(renderer.domElement);

    // Studio lighting matching original RectAreaLight rig
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight1.position.set(4, 5, 8);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xeeeeff, 1.5);
    dirLight2.position.set(-5, -2, 4);
    scene.add(dirLight2);

    // Disc Geometry creation
    const DISC_RADIUS = 1.95;
    const DISC_HOLE = 0.28;
    const discShape = new THREE.Shape();
    discShape.absarc(0, 0, DISC_RADIUS, 0, Math.PI * 2, false);
    const hole = new THREE.Path();
    hole.absarc(0, 0, DISC_HOLE, 0, Math.PI * 2, true);
    discShape.holes.push(hole);

    const extrudeSettings = {
      depth: 0.035,
      bevelEnabled: true,
      bevelSegments: 4,
      steps: 1,
      bevelSize: 0.012,
      bevelThickness: 0.012
    };
    const discGeometry = new THREE.ExtrudeGeometry(discShape, extrudeSettings);
    discGeometry.center();

    const textureLoader = new THREE.TextureLoader();
    const carouselGroup = new THREE.Group();
    scene.add(carouselGroup);

    const discMeshes = [];
    const NUM_DISCS = FILMS.length;
    const CAROUSEL_RADIUS = 4.1;
    const angleStep = (Math.PI * 2) / NUM_DISCS;

    FILMS.forEach((film, i) => {
      const tex = textureLoader.load(film.disc);
      tex.colorSpace = THREE.SRGBColorSpace;

      const mat = new THREE.MeshPhysicalMaterial({
        map: tex,
        roughness: 0.22,
        metalness: 0.18,
        clearcoat: 0.85,
        clearcoatRoughness: 0.08,
        reflectivity: 0.9,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(discGeometry, mat);
      mesh.userData = { index: i, film: film };
      carouselGroup.add(mesh);
      discMeshes.push(mesh);
    });

    let currentIndex = 0;
    let targetRotation = 0;
    let currentRotation = 0;

    function updateDiscPositions() {
      discMeshes.forEach((mesh, i) => {
        const theta = (i * angleStep) + currentRotation;
        const x = Math.sin(theta) * CAROUSEL_RADIUS + 1.25;
        const z = Math.cos(theta) * CAROUSEL_RADIUS - 1.5;
        const y = Math.sin(theta * 1.5) * 0.12;

        mesh.position.set(x, y, z);
        mesh.rotation.y = theta + Math.PI;
        mesh.rotation.x = 0.22;
        mesh.rotation.z = Math.sin(theta) * 0.08;

        const frontProximity = (Math.cos(theta) + 1) / 2;
        const scale = 0.85 + (frontProximity * 0.35);
        mesh.scale.set(scale, scale, scale);
      });
    }

    function rotateToIndex(index) {
      const snappedRotation = -index * angleStep;
      gsap.to({ rot: targetRotation }, {
        rot: snappedRotation,
        duration: 1.1,
        ease: "discGlide",
        onUpdate: function() {
          targetRotation = this.targets()[0].rot;
        },
        onComplete: () => {
          currentIndex = index;
          updateHUD(currentIndex);
        }
      });
    }

    function snapToNearest() {
      const nearestIdx = Math.round(-targetRotation / angleStep);
      const snappedRotation = -nearestIdx * angleStep;

      gsap.to({ rot: targetRotation }, {
        rot: snappedRotation,
        duration: 0.95,
        ease: "discGlide",
        onUpdate: function() {
          targetRotation = this.targets()[0].rot;
        },
        onComplete: () => {
          const normalized = ((nearestIdx % NUM_DISCS) + NUM_DISCS) % NUM_DISCS;
          if (normalized !== currentIndex) {
            currentIndex = normalized;
            updateHUD(currentIndex);
          }
        }
      });
    }

    // Touch & pointer interaction
    let isDragging = false;
    let startX = 0;
    let prevRotation = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.nav') || e.target.closest('.catalogue-section')) return;
      isDragging = true;
      startX = e.clientX;
      prevRotation = targetRotation;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      targetRotation = prevRotation + (deltaX * 0.005);
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;
      snapToNearest();
    });

    // Discrete wheel scrolling in hero
    window.addEventListener('wheel', (e) => {
      if (window.scrollY < window.innerHeight * 0.5) {
        targetRotation -= e.deltaY * 0.0015;
        snapToNearest();
      }
    }, { passive: true });

    // HUD Text Switcher with GSAP
    function updateHUD(idx) {
      const film = FILMS[idx];
      const elements = ['#film-title', '#film-director', '#film-year', '#film-starring', '#film-quote', '#film-pub'];

      gsap.to(elements, {
        opacity: 0,
        y: -8,
        duration: 0.25,
        ease: "power2.out",
        onComplete: () => {
          document.getElementById('film-title').textContent = film.title;
          document.getElementById('film-director').textContent = film.director;
          document.getElementById('film-year').textContent = film.year;
          document.getElementById('film-starring').textContent = film.starring;
          document.getElementById('film-quote').textContent = `“${film.quote}”`;
          document.getElementById('film-pub').textContent = film.pub;
          document.getElementById('hud-index').textContent = `${String(idx + 1).padStart(2, '0')} / ${String(NUM_DISCS).padStart(2, '0')}`;

          gsap.to(elements, {
            opacity: 1,
            y: 0,
            duration: 0.5,
            stagger: 0.025,
            ease: "discGlide"
          });
        }
      });
    }

    /* ========================================================
       3. SEAMLESS SCROLL TRIGGER CARD GRID
       ======================================================== */
    const cardsGrid = document.getElementById('catalogue-cards');
    FILMS.forEach((film) => {
      const card = document.createElement('div');
      card.className = 'catalogue-card';
      card.innerHTML = `
        <div class="card-media">
          <img src="${film.disc}" alt="${film.title}">
        </div>
        <div class="card-body">
          <h3>${film.title}</h3>
          <p>${film.director} • ${film.year}</p>
        </div>
      `;
      cardsGrid.appendChild(card);
    });

    gsap.utils.toArray('.catalogue-card').forEach((card, i) => {
      gsap.to(card, {
        scrollTrigger: {
          trigger: card,
          start: "top 88%",
          toggleActions: "play none none reverse"
        },
        opacity: 1,
        y: 0,
        duration: 0.9,
        ease: "discGlide",
        delay: (i % 3) * 0.08
      });
    });

    /* ========================================================
       4. ANIMATION RENDER LOOP & RESIZE
       ======================================================== */
    function render() {
      requestAnimationFrame(render);
      currentRotation += (targetRotation - currentRotation) * 0.08;
      updateDiscPositions();
      carouselGroup.rotation.y = Math.sin(Date.now() * 0.0004) * 0.04;
      renderer.render(scene, camera);
    }
    render();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
